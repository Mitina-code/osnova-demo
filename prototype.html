<title>ОСНОВА · Лента цензуры</title>
<style>
/* =====================================================================
   ZT Light UI — десктопная визуальная система
   Токены взяты из design_tokens.json скилла zt-light-ui-desktop-prototype.
   Только светлая тема. Шрифты системные, без загрузки извне.
   ===================================================================== */
:root{
  --primary:#6F3DFF; --primary-hover:#5E2FE8; --secondary:#A78BFA;
  --lilac:#EDE9FE; --mint:#10B981; --soft-mint:#E0F7F1;
  --soft-blue:#DBEAFE; --soft-pink:#FCE7F3; --soft-beige:#FDECD8;
  --bg:#FAFAFC; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280;
  --border:#E5E7EB; --border-soft:#F1F2F5;
  --danger:#DC2626; --warning:#D97706; --success:#059669;
  --r-card:18px; --r-btn:13px; --r-input:11px;
  --shadow:0 1px 2px rgba(31,41,55,.04), 0 4px 16px rgba(31,41,55,.05);
  --shadow-lift:0 4px 10px rgba(31,41,55,.06), 0 12px 32px rgba(111,61,255,.09);
  --accent-line:#D6CCFB;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
svg{flex:none}

/* ---------- каркас ---------- */
.app{display:grid; grid-template-columns:232px 1fr; min-height:100%}

.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  padding:20px 14px 16px; display:flex; flex-direction:column; gap:4px;
  position:sticky; top:env(safe-area-inset-top,0px);
  height:100vh; min-height:0; overflow-y:auto;
}
.sidebar .brand, .sidebar .rolebox{flex:none}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px}
.brand img{height:26px; width:auto; display:block}
.brand-name{font-size:17px; font-weight:700; letter-spacing:.2px}
.brand-sub{font-size:12px; color:var(--muted); margin-top:1px}

.rolebox{
  background:var(--bg); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px; margin-bottom:16px;
}
.rolebox .lab{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; font-weight:600}
.rolebox .val{font-weight:650; margin-top:2px; font-size:15px}

.nav{display:flex; flex-direction:column; gap:3px; min-height:0; overflow-y:auto; overscroll-behavior:contain}
/* Полоса прокрутки в меню — тонкая и незаметная, пока не нужна. */
.nav::-webkit-scrollbar, .sidebar::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px}
.nav::-webkit-scrollbar-thumb:hover, .sidebar::-webkit-scrollbar-thumb:hover{background:var(--secondary)}
.nav::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track{background:transparent}
.nav button{
  display:flex; align-items:center; gap:11px; width:100%;
  background:transparent; border:0; color:var(--muted); text-align:left;
  padding:10px 12px; border-radius:11px; font-size:15px; font-weight:550;
  transition:background .12s, color .12s;
}
.nav button:hover{background:var(--bg); color:var(--text)}
.nav button.active{background:var(--lilac); color:var(--primary); font-weight:650}
.nav button.active .ico{color:var(--primary)}
.nav .ico{display:grid; place-items:center; width:20px; height:20px; color:var(--muted)}
.nav .badge{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.nav button.active .badge{color:var(--primary)}
.side-foot{flex:none; margin-top:auto; padding:14px 10px 0; border-top:1px solid var(--border); color:var(--muted); font-size:12px; line-height:1.5}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  height:68px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:0 28px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
}
.top-title{font-size:17px; font-weight:650}
.top-sub{color:var(--muted); font-size:13px}
.top-right{display:flex; align-items:center; gap:12px}
.ctx{
  display:flex; align-items:center; gap:8px; background:var(--bg);
  border:1px solid var(--border); border-radius:10px; padding:7px 12px;
  font-size:13.5px; color:var(--muted);
}
.ctx b{color:var(--text); font-weight:600}
.user{display:flex; align-items:center; gap:10px; padding-left:14px; border-left:1px solid var(--border)}
.avatar{width:36px; height:36px; border-radius:11px; background:var(--lilac); color:var(--primary);
  display:grid; place-items:center; font-weight:700; font-size:13px}
.user .nm{font-weight:650; font-size:14px}

.content{padding:26px 28px 64px; max-width:1520px; width:100%}
.page-head{margin-bottom:22px}
.page-head h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.5px}
.page-head p{margin:5px 0 0; color:var(--muted); font-size:15px}

/* ---------- показатели ---------- */
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:18px 20px}
.stat .badge-ico{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; margin-bottom:12px}
.stat .k{font-size:13px; color:var(--muted); margin-bottom:6px}
.stat .v{font-size:27px; font-weight:700; letter-spacing:-.6px; line-height:1.1}
.stat .d{font-size:13px; color:var(--muted); margin-top:5px}

/* ---------- панели управления ---------- */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.bar .lab{font-size:13.5px; color:var(--muted); font-weight:550}
.seg{display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; padding:8px 14px; border-radius:9px;
  font-size:14px; font-weight:600; color:var(--muted); transition:background .12s, color .12s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--primary); color:#fff}

.tabs{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.tab{
  display:flex; align-items:center; gap:11px; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; padding:13px 18px;
  font-weight:600; font-size:15px; color:var(--muted); transition:border-color .12s, box-shadow .12s;
}
.tab:hover{border-color:var(--secondary)}
.tab .dot{width:9px; height:9px; border-radius:50%; flex:none}
.tab .n{font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.3px; margin-right:2px}
.tab.on{border-color:var(--primary); background:var(--lilac); color:var(--primary)}
.tab.on .n{color:var(--primary)}
.tab.g .dot{background:var(--success)} .tab.o .dot{background:var(--warning)} .tab.r .dot{background:var(--danger)}

/* ---------- кнопки ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius:var(--r-btn); padding:11px 18px; font-weight:600; font-size:14.5px;
  transition:background .12s, border-color .12s, color .12s;
}
.btn:hover{background:var(--bg); border-color:var(--secondary)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn.primary:hover{background:var(--primary-hover); border-color:var(--primary-hover)}
.btn.danger{background:var(--surface); border-color:var(--border); color:var(--danger)}
.btn.danger:hover{background:#FEF2F2; border-color:#FCA5A5}
.btn.ghost{background:transparent; border-color:transparent; color:var(--primary)}
.btn.ghost:hover{background:var(--lilac)}
.btn.sm{padding:8px 13px; font-size:13.5px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.actionbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
  padding:16px 20px; margin-bottom:14px;
}
.actionbar .txt{font-size:14.5px; color:var(--muted); max-width:640px}
.actionbar .txt b{color:var(--text); font-weight:650}

/* ---------- метки ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
  background:var(--bg); border-radius:999px; padding:4px 11px; font-size:12.5px;
  color:var(--muted); white-space:nowrap; font-weight:550;
}
.chip.g{background:var(--soft-mint); border-color:#BFE9DC; color:var(--success)}
.chip.o{background:var(--soft-beige); border-color:#F3D5AC; color:var(--warning)}
.chip.r{background:var(--soft-pink); border-color:#F6C6DC; color:var(--danger)}
.chip.a{background:var(--lilac); border-color:#D6CCFB; color:var(--primary)}

/* ---------- очередь ---------- */
.rows{display:flex; flex-direction:column; gap:10px}
.row{
  display:grid; grid-template-columns:4px 1.15fr 1.35fr auto; gap:18px; align-items:start;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
  padding:16px 18px; transition:border-color .12s, box-shadow .12s;
}
.row:hover{border-color:var(--secondary); box-shadow:var(--shadow)}
.stripe{border-radius:3px; align-self:stretch; min-height:48px; background:var(--border)}
.stripe.g{background:var(--success)} .stripe.o{background:var(--warning)} .stripe.r{background:var(--danger)}
.row .who{font-weight:650; margin-bottom:4px; font-size:15px}
.row .meta{color:var(--muted); font-size:13px}
.row .marks{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.row .sum{font-weight:600; margin-bottom:4px; font-size:14.5px}
.row .why{color:var(--muted); font-size:13.5px}
.row .acts{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.link{background:none; border:0; color:var(--primary); font-size:13.5px; font-weight:600; padding:0 0 0 6px}
.link:hover{text-decoration:underline; text-underline-offset:2px}
.fold{display:none; margin-top:10px; padding:12px 14px; background:var(--bg);
  border:1px solid var(--border-soft); border-radius:12px; font-size:13.5px; color:var(--muted)}
.fold.open{display:block}
.more{display:flex; justify-content:center; padding:18px 0 0}

/* ---------- выноски ---------- */
.note{
  border:1px solid var(--border); border-left:3px solid var(--primary); background:var(--surface);
  border-radius:0 14px 14px 0; padding:14px 18px; font-size:14.5px; margin:14px 0;
}
.note.warn{border-color:#F3D5AC; border-left-color:var(--warning); background:var(--soft-beige); color:#8A5A0B}
.note.ok{border-color:#BFE9DC; border-left-color:var(--success); background:var(--soft-mint); color:#0A6B4F}
.note b{font-weight:650}

.empty{text-align:center; padding:56px 20px; color:var(--muted);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card)}
.empty .big{width:52px; height:52px; margin:0 auto 14px; border-radius:15px;
  background:var(--soft-mint); color:var(--success); display:grid; place-items:center}
.empty b{display:block; color:var(--text); font-size:17px; margin-bottom:5px}

/* ---------- карточка материала ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
  padding:22px 24px; margin-bottom:14px}
.card h3{margin:0 0 14px; font-size:16px; font-weight:650}
.split{display:grid; grid-template-columns:1.5fr 1fr; gap:14px; align-items:start}
.split.поровну{grid-template-columns:1fr 1fr}
.body-text{background:var(--bg); border:1px solid var(--border-soft); border-radius:14px;
  padding:18px 20px; line-height:1.8; font-size:15.5px}
mark{background:var(--soft-beige); color:#8A5A0B; border-bottom:2px solid var(--warning);
  padding:1px 3px; border-radius:4px}
mark.r{background:var(--soft-pink); color:var(--danger); border-bottom-color:var(--danger)}
.ts{display:grid; grid-template-columns:64px 1fr; gap:8px 14px; font-size:15px}
.ts .t{color:var(--muted); font-size:13px; padding-top:2px; font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:auto 1fr; gap:9px 16px; font-size:14px}
.kv .k{color:var(--muted)}
.progress{display:flex; align-items:center; gap:12px; font-size:13.5px; color:var(--muted); margin-bottom:14px}
.pbar{flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; max-width:280px}
.pbar i{display:block; height:100%; background:var(--primary); border-radius:3px}

/* ---------- вымарывание ---------- */
.redact{background:var(--bg); border:1px solid var(--border-soft); border-radius:14px;
  padding:18px 20px; line-height:2.1; font-size:15.5px}
.frag{border-radius:6px; padding:1px 3px; cursor:pointer; border-bottom:1px dashed var(--border);
  transition:background .1s}
.frag:hover{background:var(--lilac)}
/* Изъятое в оригинале — зачёркнуто и осталось читаемым. */
.frag.cut{
  background:var(--soft-pink); color:var(--danger); border-bottom-color:transparent;
  text-decoration:line-through; text-decoration-thickness:2px;
  text-decoration-color:var(--danger);
}
.preview{background:var(--bg); border:1px solid var(--border-soft); border-radius:14px;
  padding:18px 20px; line-height:1.95; font-size:15.5px}
/* В экземпляре адресата изъятого текста нет вовсе — только полосы.
   Полоса на каждое слово, чтобы строка переносилась как обычный текст
   и было видно, сколько именно закрашено. */
.blk{display:inline-block; height:.95em; vertical-align:-0.12em;
  background:var(--text); border-radius:2px}
.blk-группа{white-space:normal}

/* ---------- журнал ---------- */
.log{display:flex; flex-direction:column; gap:10px}
.entry{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border);
  border-radius:0 14px 14px 0; padding:14px 18px}
.entry.allow{border-left-color:var(--success)}
.entry.deny{border-left-color:var(--danger)}
.entry.part{border-left-color:var(--warning)}
.entry .h{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-weight:650; font-size:14.5px}
.entry .id{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; font-weight:500}
.entry .l{color:var(--muted); font-size:13.5px; margin-top:4px}

/* ---------- модальное окно ---------- */
.back{position:fixed; inset:0; background:rgba(31,41,55,.42); display:grid; place-items:center;
  padding:24px; z-index:60; backdrop-filter:blur(2px)}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:20px;
  width:min(760px,100%); max-height:86vh; display:flex; flex-direction:column;
  box-shadow:0 24px 64px rgba(31,41,55,.22)}
.mh{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  padding:22px 24px 18px; border-bottom:1px solid var(--border)}
.mh h3{margin:0; font-size:19px; font-weight:700}
.mb{padding:20px 24px; overflow:auto}
.mf{padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap}
.x{background:none; border:0; color:var(--muted); font-size:22px; line-height:1; padding:2px 8px; border-radius:8px}
.x:hover{background:var(--bg); color:var(--text)}
.clist{display:flex; flex-direction:column; gap:8px}
.citem{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start;
  border:1px solid var(--border); border-radius:13px; padding:12px 14px; background:var(--surface)}
.citem .w{font-weight:650; font-size:14px}
.citem .s{color:var(--muted); font-size:13px; margin-top:2px}
.citem textarea{
  width:100%; margin-top:9px; border:1px solid var(--border); border-radius:var(--r-input);
  padding:9px 12px; font-size:13.5px; background:var(--surface); color:var(--text);
  resize:vertical; min-height:56px; line-height:1.5;
}
.citem textarea:focus{outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(111,61,255,.14)}

.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:var(--text); color:#fff; padding:13px 22px; border-radius:13px; font-size:14px;
  box-shadow:0 12px 32px rgba(31,41,55,.28); z-index:90; max-width:calc(100% - 48px)}



.rolebox select#roleSelect{
  display:block; width:100%; margin-top:6px; background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:var(--r-input); padding:9px 11px;
  font-size:14.5px; font-weight:600; cursor:pointer;
}
.rolebox select#roleSelect:focus{outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(111,61,255,.14)}
.rolebox label.lab{cursor:default}


/* Ряд кнопок выбора с длинными подписями: переносится, а не уезжает за край. */
.seg.сборный{flex-wrap:wrap; height:auto; padding:6px}
.seg.сборный button{white-space:normal; text-align:left; line-height:1.35; padding:7px 11px}

/* ---------- зона скана заявления ---------- */
.drop-зона{border:2px dashed var(--border); border-radius:16px; padding:26px 20px;
  text-align:center; background:var(--bg); margin-bottom:16px}
.drop-ико{width:52px; height:52px; margin:0 auto 12px; border-radius:15px;
  background:var(--lilac); color:var(--primary); display:grid; place-items:center}
.drop-зона b{display:block; font-size:16px; margin-bottom:5px}
.drop-зона span{color:var(--muted); font-size:14px}

/* ---------- граф связей ----------
   Радиальная раскладка: человек в центре, контакты по кругу.
   Красным — связи, поднятые системой; серым пунктиром — обычные. */
.граф{background:var(--bg); border:1px solid var(--border-soft); border-radius:14px; padding:10px}
.граф svg{display:block; width:100%; height:auto}

/* ---------- временная шкала ---------- */
.шкала{position:relative; padding-left:26px}
.шкала:before{content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--border)}
.шкала-точка{position:relative; margin-bottom:18px}
.шкала-точка:before{content:''; position:absolute; left:-22px; top:6px; width:9px; height:9px;
  border-radius:50%; background:var(--primary); box-shadow:0 0 0 3px var(--lilac)}
.шкала-дата{font-size:12.5px; color:var(--muted); margin-bottom:3px}
.шкала-текст{font-size:14.5px; line-height:1.6}

/* ---------- фраза дня, праздник, журнал ---------- */
.фраза{
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  background:linear-gradient(120deg, var(--lilac), var(--soft-mint));
  border:1px solid var(--accent-line); border-radius:var(--r-card);
  padding:16px 20px; margin-bottom:20px;
}
.фраза-текст{font-size:16px; font-weight:550; color:#3d2b6b; max-width:760px; line-height:1.6}
.фраза-имя{color:var(--primary); font-weight:650}

/* Короткий материал: его текст и есть содержание строки, поэтому
   он набран как текст письма, а не как служебное резюме. */
.целиком{font-size:15px; line-height:1.55; color:var(--text); font-weight:500;
  background:var(--bg); border:1px solid var(--border-soft); border-radius:10px;
  padding:9px 12px; margin-bottom:6px}

.праздник{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--accent-line);
  border-radius:var(--r-card); padding:20px 22px; margin-bottom:14px;
  box-shadow:0 2px 14px rgba(111,61,255,.10);
}
.праздник-арт{width:120px; flex:none}
.праздник-арт svg{width:100%; height:auto; display:block; border-radius:12px}
.праздник-загл{font-size:19px; font-weight:700; margin-bottom:6px}
.праздник-текст{color:var(--muted); font-size:15px; line-height:1.65; max-width:620px}

ul.plain{list-style:none; padding:0; margin:0}
ul.plain li{position:relative; padding-left:24px; margin-bottom:9px; font-size:14.5px}
ul.plain li:before{content:''; position:absolute; left:6px; top:9px; width:6px; height:6px;
  border-radius:50%; background:var(--success)}
ul.plain.warn-list li:before{background:var(--warning)}

.переключ{display:flex; align-items:center; gap:11px; padding:9px 0; font-size:14.5px; cursor:pointer}
.переключ input{width:18px; height:18px; margin:0; accent-color:var(--primary)}

.два{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:640px){ .два{grid-template-columns:1fr} }

.находки{display:flex; flex-direction:column; gap:4px; margin:-8px 0 14px}
.находка{display:flex; justify-content:space-between; gap:12px; align-items:baseline; width:100%;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:9px 13px; text-align:left; font-size:14px}
.находка:hover{border-color:var(--primary); background:var(--lilac)}
.находка span{color:var(--muted); font-size:13px}
.выбран-чел{background:var(--lilac); border:1px solid var(--accent-line); border-radius:10px;
  padding:10px 14px; margin-bottom:16px; font-size:14.5px}

/* журнал выглядит как журнал: линованная таблица с номерами */
.журнал{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); overflow:auto}
.журнал-таб{width:100%; border-collapse:collapse; font-size:13.5px; min-width:960px}
.журнал-таб th{background:var(--bg); text-align:left; padding:11px 12px; font-weight:650;
  color:var(--muted); border-bottom:1.5px solid var(--border); white-space:nowrap}
.журнал-таб td{padding:10px 12px; border-bottom:1px solid var(--border-soft);
  border-right:1px solid var(--border-soft); vertical-align:top}
.журнал-таб td:last-child{border-right:0}
.журнал-таб th{border-right:1px solid var(--border-soft)}
.журнал-таб th:last-child{border-right:0}
.журнал-таб tr.внешн td{background:var(--bg)}
.журнал-таб tbody tr:hover td{background:var(--lilac)}
.журнал-таб.печатный{min-width:0; font-size:11.5px}
.журнал-таб.печатный td, .журнал-таб.печатный th{padding:6px 7px}

/* ---------- добавленные разделы ---------- */
.pulse{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--success);
  margin-right:7px; box-shadow:0 0 0 0 rgba(5,150,105,.5); animation:пульс 1.8s infinite}
@keyframes пульс{70%{box-shadow:0 0 0 7px rgba(5,150,105,0)} 100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}
.head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap}
.head-acts{display:flex; gap:10px; flex-wrap:wrap; padding-top:6px}
.head-acts .btn{display:inline-flex; align-items:center; gap:8px}

h2.sect{font-size:21px; font-weight:700; margin:30px 0 14px; letter-spacing:-.3px}

.cards3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:8px}
.cards3 .card{margin-bottom:0}

/* поля ввода — всегда белые, фокус фиолетовый */
.search{
  flex:1; min-width:240px; max-width:460px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-input);
  padding:10px 14px; font-size:14.5px; color:var(--text);
}
.search:focus{outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(111,61,255,.14)}
.fld{display:block; margin-bottom:16px; font-size:13.5px; color:var(--muted); font-weight:550}
.fld input, .fld textarea{
  display:block; width:100%; margin-top:7px; background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:var(--r-input);
  padding:11px 14px; font-size:15px; line-height:1.5;
}
.fld textarea{min-height:110px; resize:vertical}
.fld input:focus, .fld textarea:focus{outline:0; border-color:var(--primary); box-shadow:0 0 0 3px rgba(111,61,255,.14)}

/* выбор режима — крупные цели нажатия */
.opt{
  display:block; border:1px solid var(--border); border-radius:14px;
  padding:14px 18px; margin-bottom:10px; cursor:pointer; background:var(--surface);
  transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--secondary)}
.opt.on{border-color:var(--primary); background:var(--lilac)}
.opt b{display:block; font-size:15.5px; margin-bottom:3px}
.opt span{color:var(--muted); font-size:14px}
.opt.on span{color:var(--primary)}

/* лист для вклейки в бумажный журнал */
.glue{border:1px solid var(--border); border-radius:12px; overflow:hidden; font-size:13px}
.glue-head, .glue-row{display:grid; grid-template-columns:92px 1.4fr 130px 1.6fr; gap:12px; padding:9px 14px}
.glue-head{background:var(--bg); font-weight:650; color:var(--muted); border-bottom:1px solid var(--border)}
.glue-row{border-bottom:1px solid var(--border-soft)}
.glue-row:last-child{border-bottom:0}
.glue-row span{overflow-wrap:anywhere}

/* ---------- БЛАНК ДОКУМЕНТА (акт, реестр) ----------
   Оформление по ГОСТ Р 7.0.97-2016. На экране это предпросмотр,
   на бумаге — готовый к подписи документ: один акт = один лист. */
.бланк{
  /* Times New Roman — то, чем набирают служебные документы. На экране бланк
     выглядит так же, как выйдет из принтера, и это не украшение: сотрудник
     должен видеть будущий документ, а не его приблизительный вид. */
  font-family:"Times New Roman", Times, serif;
  background:#fff; color:#000; font-size:14.5px; line-height:1.5;
  padding:26px 28px; border:1px solid var(--border); border-radius:12px;
}
.бланк + .бланк{margin-top:16px}
.бл-верх{display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start; margin-bottom:22px}
.бл-орг{font-size:11.5px; line-height:1.35; text-transform:uppercase; letter-spacing:.2px}
.бл-утв{font-size:12.5px; line-height:1.7}
.бл-подп{letter-spacing:1px}
.бл-вид{text-align:center; font-size:17px; font-weight:700; letter-spacing:2px; margin:18px 0 10px}
.бл-рек{display:flex; justify-content:space-between; font-size:13px}
.бл-место{font-size:13px; margin-top:2px}
.бл-загол{margin:16px 0 18px; font-size:13.5px; line-height:1.45}
.бл-абз{margin:0 0 12px; text-align:justify}
.бл-подзаг{font-weight:650; margin:16px 0 8px}
.бл-свед{display:grid; grid-template-columns:200px 1fr; gap:4px 14px; margin-bottom:14px}
.бл-к{color:#333}
.бл-к:after{content:' ....................................................'; color:#999; letter-spacing:-1px}
.бл-з{font-weight:550}
.бл-подписи{margin-top:20px}
.бл-подпись{display:grid; grid-template-columns:1fr 150px 130px; gap:14px; align-items:end; margin-bottom:6px}
.бл-линия{border-bottom:1px solid #000; height:14px}
.бл-имя{text-align:right}
.бл-дата{margin-top:10px; font-size:13px}
.бл-сноска{margin-top:16px; font-size:11.5px; color:#444; font-style:italic}
.бл-таб{width:100%; border-collapse:collapse; font-size:11.5px; table-layout:fixed; margin:14px 0}
.бл-таб th, .бл-таб td{border:1px solid #000; padding:5px 6px; vertical-align:top; overflow-wrap:anywhere}
.бл-таб th{font-weight:650; text-align:center; background:#f2f2f2}

/* предпросмотр печати материала */
.print-sheet{border:1px solid var(--border); border-radius:12px; padding:22px 24px; background:var(--surface); line-height:1.7}
.print-head{font-size:13px; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px}
.print-body{margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft)}
.print-foot{margin-top:18px; padding-top:12px; border-top:1px solid var(--border); font-size:13px; color:var(--muted)}

a.btn{text-decoration:none}

@media (max-width:1180px){ .cards3{grid-template-columns:1fr} }
/* Печатается только #printRoot — туда кладётся один нужный документ.
   Всё остальное на печать не уходит вовсе: так не бывает ни 135 страниц,
   ни схлопнутой в колонку вёрстки. */
#printRoot{display:none}
@media print{
  .app, #modalRoot, #toastRoot{display:none !important}
  #printRoot{display:block}
  body{background:#fff; color:#000; font-size:11pt}
  #printRoot .note, #printRoot .btn, #printRoot button{display:none !important}
  #printRoot .print-sheet{border:0; border-radius:0; padding:0}
  #printRoot .card{border:0; padding:0; margin-bottom:12px; background:none}
  @page{margin:15mm}
  #printRoot .журнал{border:0; overflow:visible}
  #printRoot .журнал-таб{min-width:0; width:100%; font-size:7.5pt; table-layout:fixed}
  #printRoot .журнал-таб th, #printRoot .журнал-таб td{padding:3px 4px; overflow-wrap:anywhere}
  /* ширины колонок журнала: имена широкие, служебные поля узкие —
     иначе fixed-раскладка делит всё поровну и рвёт фамилии */
  #printRoot .журнал-таб.печатный th:nth-child(1){width:5%}
  #printRoot .журнал-таб.печатный th:nth-child(2){width:9%}
  #printRoot .журнал-таб.печатный th:nth-child(3){width:11%}
  #printRoot .журнал-таб.печатный th:nth-child(4){width:19%}
  #printRoot .журнал-таб.печатный th:nth-child(5){width:19%}
  #printRoot .журнал-таб.печатный th:nth-child(6){width:9%}
  #printRoot .журнал-таб.печатный th:nth-child(7){width:5%}
  #printRoot .журнал-таб.печатный th:nth-child(8){width:11%}
  #printRoot .журнал-таб.печатный th:nth-child(9){width:12%}
  #printRoot .glue-head, #printRoot .glue-row{font-size:8.5pt; padding:5px 8px}
  #printRoot .kv{gap:4px 12px}
  #printRoot h3{margin:10px 0 6px}
  #printRoot tr, #printRoot .row, #printRoot .entry,
  #printRoot .card, #printRoot .glue-row{break-inside:avoid}
  #printRoot{font-family:"Times New Roman", Times, serif}
  #printRoot .бланк{border:0; border-radius:0; padding:0; font-size:12pt; break-after:page}
  #printRoot .бланк.последний{break-after:auto}
  #printRoot .бланк + .бланк{margin-top:0}
  #printRoot .бл-таб{font-size:8.5pt}
}

/* ---------- адаптив: десктоп от 1366, планшет — свёрнутый сайдбар ---------- */
@media (max-width:1180px){
  .split{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1000px){
  .app{grid-template-columns:72px 1fr}
  .brand{justify-content:center; padding:2px 0 18px}
  .brand-text, .rolebox, .side-foot{display:none}
  .nav button{justify-content:center; padding:11px 0}
  .nav button span:not(.ico){display:none}
  .row{grid-template-columns:4px 1fr; gap:12px}
  .row .acts{grid-column:2}
  .content{padding:20px 18px 56px}
  .topbar{padding:0 18px}
  .ctx{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

<script>
/* =======================================================================
   ДАННЫЕ

   Прототип больше ничего не выдумывает. Набор приходит из модуля данных
   (папка data) готовым файлом data-*.js, который подключён в начале страницы.

   Внутри набора — тот же формат, что отдаёт источник по контракту
   (data/contract.js). Ниже единственное место, где формат контракта
   переводится в то, с чем работают экраны.

   Когда появятся настоящие ручки ЗТ, набор будет приходить оттуда,
   а этот переводчик останется прежним.

   Оформление — по дизайн-системе ZT Light UI (.claude/skills).
   Публичное зеркало прототипа: github.com/Mitina-code/osnova-demo
   ======================================================================= */

/* --------------------------------------------------------------
   НАСЕЛЕНИЕ УЧРЕЖДЕНИЯ
   Приходит сжатым: человек — массив, а не объект. На 2400 людях
   это вдвое меньше веса. Здесь разворачиваем обратно один раз.
   -------------------------------------------------------------- */
const СТРАНА = { ru:'Россия', uz:'Узбекистан', tg:'Таджикистан' };
const РИСК_СЛОВОМ = { red:'высокий', orange:'повышенный', green:'обычный' };

const POP = (() => {
  const сырое = window.OSNOVA_POP;
  if (!сырое) return { люди: [], поId: {}, сводка: {}, параметры: {} };
  const люди = сырое.люди.map(([id, name, dob, lang, unit, article, since, risk, zt, confirmed, contacts]) => ({
    id, name, dob, lang, unit, article, since, risk,
    zt: !!zt,
    /* Подтверждена ли личность оперативным сотрудником. Без подтверждения
       человеку доступна только текстовая переписка. */
    confirmed: !!confirmed,
    citizenship: СТРАНА[lang] || lang,
    riskText: РИСК_СЛОВОМ[risk],
    contacts: contacts.map(([cn, cr, cp, cv, cprot]) => ({
      name: cn, role: cr, phone: cp, verified: !!cv, protected: !!cprot,
      risk: cprot ? 'green' : (cv ? 'green' : 'orange'),
    })),
  }));
  const поId = {};
  люди.forEach(p => { поId[p.id] = p; });
  return { люди, поId, сводка: сырое.сводка || {}, параметры: сырое.параметры || {} };
})();

/* Кто участвует в материале: человек из населения и один из его контактов. */
function участники(m){
  const чел = POP.поId[m.pid];
  const контакт = чел && чел.contacts[m.ci];
  if (!чел || !контакт) return null;
  return m.dir === 'in'
    ? { отправитель: контакт, получатель: чел, чел, контакт }
    : { отправитель: чел, получатель: контакт, чел, контакт };
}

const SETS = {
  'shift-normal': 'Обычный день · 200',
  'shift-peak':   'Пиковый день · 500',
};

const CHANNEL_LABEL = { letter: 'письмо', voice: 'голосовое сообщение', video: 'видеосообщение' };
const KIND_LABEL    = { text: 'Письмо', audio: 'Голосовое сообщение', video: 'Видеосообщение' };
const DIR_LABEL     = { in: 'Входящее', out: 'Исходящее' };
const ORIGIN_LABEL  = { digital: 'Цифровое', scanned: 'Отсканировано', recognized: 'Распознано с бумаги' };
const MEDIUM_LABEL  = { paper: 'бумага', digital: 'электронное' };
const LANG_LABEL    = { ru: 'Русский', uz: 'Узбекский', tg: 'Таджикский', kg: 'Киргизский' };

const pad2 = n => String(n).padStart(2, '0');
const hhmm = iso => { const d = new Date(iso); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const mmss = sec => `${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`;

/* Перевод материала из формата контракта в формат экранов. */
function fromContract(m) {
  const a = m.a;
  const уч = участники(m);
  const чел = уч ? уч.чел : null;
  const контакт = уч ? уч.контакт : null;
  const lang = LANG_LABEL[m.lang] || m.lang;
  const переведено = m.content && m.content.translation;

  const ts = (m.content && m.content.transcript)
    ? m.content.transcript.map(x => [mmss(x.t), x.s])
    : null;
  const hlts = ts
    ? ts.map(([, s], i) => (a.hl || []).some(h => s.includes(h) || h.includes(s)) ? i : -1).filter(i => i >= 0)
    : [];

  return {
    id: m.id,
    pid: m.pid,
    ci: m.ci,
    /* Фамилия адресата, которой в картотеке нет. Тогда вносить некого:
       письмо отклоняется с отметкой «адресат не числится». */
    toUnknown: m.toUnknown || null,
    risk: a.risk,
    at: hhmm(m.at),
    from: уч ? уч.отправитель.name : '—',
    to: уч ? уч.получатель.name : '—',
    unit: чел ? чел.unit : '',
    dir: DIR_LABEL[m.dir] || m.dir,
    channel: CHANNEL_LABEL[m.channel] || m.channel,
    kind: m.kind,
    kindLabel: KIND_LABEL[m.kind] || m.kind,
    size: m.size,
    origin: ORIGIN_LABEL[m.origin] || m.origin,
    lang: переведено ? `${lang} → русский` : lang,
    sum: a.sum, why: a.why, full: a.full, basis: a.basis, conf: a.conf,
    checked: a.checked, notFound: a.notFound, rec: a.rec,
    text: m.content ? m.content.text : null,
    ts,
    tr: переведено || null,
    frames: (m.content && m.content.frames) ? m.content.frames.map(x => [x.t, x.d]) : null,
    hl: a.hl || [],
    hlts,
    sample: !!m.sample,
    medium: m.medium || 'digital',
    paperSource: m.paperSource || null,
    chars: m.chars || 0,
    /* короткий материал читается целиком прямо в ленте */
    short: !!m.short,
    durationSec: m.durationSec || null,
    protected: !!(контакт && контакт.protected),
    status: 'queue',
  };
}

/* Загрузка набора. Файл data-*.js подключается тегом script и кладёт
   набор в window.OSNOVA_DATA — поэтому работает и при открытии файла
   двойным кликом, без всякого сервера. */
function loadQueue(setName) {
  const raw = (window.OSNOVA_SETS || {})[setName];
  if (!raw || !Array.isArray(raw.materials)) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><div class="big">!</div><b>Набор данных не подключён</b>' +
      '<div>Рядом со страницей должен лежать файл <code>data-shift-peak.js</code>.<br>' +
      'Собрать его: <code>node data/generate.js</code></div></div>';
    return [];
  }
  RULES_TOTAL = (raw.rules || []).length;
  return raw.materials.map(fromContract);
}

let RULES_TOTAL = 0;
/* Акт получает номер в момент решения о недопуске и больше не меняется. */
let ACT_NO = 2100;
/* ---------------- состояние ---------------- */
const S = {
  view:'queue',
  role:'censor',
  feedFilter:'attention',
  personQuery:'', personUnit:'all',
  liveFilter:'all', staffQuery:'',
  personSet:null, groupId:null,
  set:'shift-peak',
  stack:'green',
  trust:'full',              // full | half | manual
  automation:'mid',          // режим автоматического контроля: high | mid | low
  графРежим:'risk',          // что показывать на графе связей
  черновикГруппы:null, черновикКонтакта:null, черновикДелегата:null,
  профФильтр:'all', черновикБеседы:null, черновикСнятия:null, черновикРапорта:null,
  facility:'ик',             // тип учреждения: ик | сизо
  признаки:null, имяГруппы:'', режимГруппы:'signal', поискГруппы:'',
  сортировкаЛюдей:'default', фильтрЛюдей:'all',

const RISK_ONE  = {green:'зелёный', orange:'оранжевый', red:'красный'};
const RISK_LETTER = {green:'g', orange:'o', red:'r'};

/* время, которое экономится на одном материале, прошедшем без открытия */
const SAVED_PER_ITEM_SEC = 60;

function left(risk){return S.queue.filter(x=>x.status==='queue' && x.risk===risk)}
function leftAll(){return S.queue.filter(x=>x.status==='queue')}
function decidedCount(){return S.queue.length - leftAll().length}
function autoCount(){return S.log.filter(e=>e.group>1).length}
function savedText(){
  const sec = autoCount()*SAVED_PER_ITEM_SEC;
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  return h ? `${h} ч ${m} мин` : `${m} мин`;
}
/* можно ли для стопки групповое действие при текущем режиме доверия */
function groupAllowed(risk){
  if(S.trust==='manual') return false;
  if(S.trust==='half') return risk==='green';
  return true;
}
/* Выборка уходит вместе со всей пачкой. Держать 5% зелёных перед отправкой
   незачем: остальные 95% и так уходят непрочитанными, значит задержка ничего
   не предотвращает. Это измерение качества анализатора, а не защита, —
   и проверяется оно после доставки, в разделе «Контроль качества». */
/* Первым действием уходит всё, кроме выборки: выборка остаётся, чтобы
   цензор могла решить — проверить её или согласовать вторым кликом. */
function bulkSet(risk){
  return left(risk).filter(x => !(risk === 'green' && x.sample));
}

/* ---------------- утилиты вывода ---------------- */
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){
  const r=document.getElementById('toastRoot');
  r.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t=setTimeout(()=>r.innerHTML='',3400);
}
function modal(html){document.getElementById('modalRoot').innerHTML = `<div class="back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function hlText(txt, hl){
  let out = esc(txt);
  (hl||[]).forEach(h=>{ out = out.replace(esc(h), m=>`<mark>${m}</mark>`) });
  return out;
}

/* Развилка после согласования основной массы зелёных.
   Пока в стопке есть не только выборка — это обычная подсказка.
   Когда осталась одна выборка — предложение с двумя ответами. */
function блокВыборки(текущие, выборок){
  if (!выборок) return '';
  const толькоВыборка = текущие.length === выборок;

  if (!толькоВыборка) return `<div class="note"><b>Точечный контроль — ${выборок}
    ${plural(выборок,'материал','материала','материалов')}.</b> Система отметила каждый
    двадцатый зелёный. Они останутся после того, как вы согласуете остальные.</div>`;

  return `
    <div class="actionbar" style="border-color:var(--primary); background:var(--lilac)">
      <div class="txt"><b>Остальные зелёные согласованы.</b>
        Осталось ${выборок} ${plural(выборок,'письмо','письма','писем')}, отобранных случайно.
        Хотите точечно проверить, не ошибается ли анализатор?</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn" onclick="смотретьВыборку()">Посмотреть по очереди</button>
        <button class="btn primary" onclick="согласоватьВыборку()">Согласовать все ${выборок}</button>
      </div>
    </div>`;
}

/* Вторым кликом — согласовать всю выборку разом. */
function согласоватьВыборку(){
  const items = left('green').filter(x => x.sample);
  if (!items.length) return;
  items.forEach(x => {
    x.status = 'allowed';
    S.log.unshift({
      id:x.id, from:x.from, to:x.to, decision:'allow',
      basis:'точечный контроль не проводился, решение анализатора принято',
      by:'Соколова Е.С., цензор', at:nowStamp(), group:items.length, act:null
    });
  });
  render();
  toast('Согласовано ' + items.length + ' ' + plural(items.length,'письмо','письма','писем'));
}

/* Либо посмотреть их одно за другим. */
function смотретьВыборку(){
  const items = left('green').filter(x => x.sample);
  if (!items.length) return;
  S.conveyor = items.map(x => x.id);
  openCard(S.conveyor[0]);
}

/* Поля поиска перерисовывают экран на каждом нажатии. Поле при этом
   создаётся заново, а focus() ставит каретку в начало строки — и текст
   набирается задом наперёд: «Иванов» превращается в «вонави».
   Поэтому запоминаем положение каретки и возвращаем его после перерисовки. */
function вводПоиска(id, применить){
  const поле = document.getElementById(id);
  if (!поле) return;
  const позиция = поле.selectionStart;
  применить(поле.value);
  const новое = document.getElementById(id);
  if (!новое) return;
  новое.focus();
  try { новое.setSelectionRange(позиция, позиция); } catch (e) { /* не текстовое поле */ }
}

function showMore(){S.shown += 50; render()}
function plural(n,a,b,c){
  const m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return a;
  if(m10>=2 && m10<=4 && (m100<10||m100>=20)) return b;
  return c;
}

/* Весь текст короткого материала — одной строкой. Для голоса и видео
   это расшифровка: слушать нечего, читать нечего сверх этих слов. */
function целиком(x){
  if (x.text) return x.text;
  if (x.ts) return x.ts.map(([, s]) => s).join(' ');
  return '';
}

     Недопуск так не оформить — он требует мотивировки, и для него карточка. */
  const короткий = x.short && !x.protected;

  return `<div class="row">
    <div class="stripe ${RISK_LETTER[x.risk]}"></div>
    <div>

        ${меткаСоучастника(x.pid)}
        ${адресатНеПодтверждён(x) ? '<span class="chip o" title="Личность адресата не подтверждена оперативным сотрудником">адресат не подтверждён</span>' : ''}
        ${x.sample?'<span class="chip a" title="Отмечен для точечного контроля: можно посмотреть и убедиться, что анализатор не ошибся">точечный контроль</span>':''}
        ${x.protected?'<span class="chip a">защищённая переписка</span>':''}
      </div>
    </div>
    <div>
      ${короткий
        ? `<div class="целиком">${hlText(целиком(x), x.hl)}</div>
           <div class="why">${esc(x.why)}${x.tr?` · перевод: ${esc(x.tr)}`:''}</div>`
        : `<div class="sum">${esc(x.sum)}</div>
           <div class="why">${esc(x.why)} <button class="link" onclick="toggleFold('${x.id}')">подробнее</button></div>
           <div class="fold" id="f-${x.id}">
             ${esc(x.full)}<br><br>

           </div>`}

      <button class="btn sm" onclick="openContext('${x.id}')" title="История переписки за три месяца">Контекст</button>
      ${адресатНеПодтверждён(x) ? `<button class="btn sm" onclick="внестиАдресата('${x.id}')" title="Личность адресата не подтверждена">Адресат</button>` : ''}
      <button class="btn sm" onclick="передатьОперативнику('${x.id}')" title="Передать оперативному сотруднику">Оперативнику</button>

/* Носитель письма словами: бумага — с указанием, откуда она пришла. */
function МЕДИУМ(x){
  if (x.kind !== 'text') return x.origin;
  return x.medium === 'paper'
    ? 'бумага · ' + (x.paperSource || 'распознано')
    : 'электронное';
}
function toggleFold(id){document.getElementById('f-'+id)?.classList.toggle('open')}
function setStack(k){S.stack=k; S.shown=30; render()}
function setTrust(t){S.trust=t; S.shown=30; render()}

function setSet(name){
  S.set = name;
  S.queue = loadQueue(name);
  S.total = S.queue.length;
  S.log = []; S.shown = 30; S.stack = 'green'; S.conveyor = null;

}

/* ---------------- экран 2: подтверждение группы ---------------- */
function startGroup(risk){
  if(risk==='orange'){ startConveyor(); return }
  const items = bulkSet(risk);
  if(!items.length){ toast('В этой стопке нечего подтверждать.'); return }
  const deny = risk==='red';

  modal(`
    <div class="mh">
      <div>
        <h3>${deny?'Оформить недопуск':'Разрешить материалы'} · ${items.length}</h3>

      </div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button>
    </div>
    <div class="mb">
      ${deny && !аттестован() ? `<div class="note warn"><b>Акт подпишет аттестованный сотрудник.</b> Решение принимаете вы, но акт уходит на подпись: ${esc(ПОДПИСАНТ.name)}, ${esc(ПОДПИСАНТ.post)}. Печать станет доступна после подписи.</div>` : ''}
      <div class="clist" id="clist">
        ${items.map(x=>`
          <div class="citem" id="ci-${x.id}">
            <div>
              <div class="w">${esc(x.from)} → ${esc(x.to)}</div>
              <div class="s">${x.id} · ${x.at} · ${esc(x.kindLabel)} · ${esc(x.sum)}</div>
              ${deny?`<textarea aria-label="Мотивировка">${esc(x.full)}</textarea>`:''}
            </div>
            <button class="btn sm" onclick="dropFromGroup('${x.id}')">Убрать</button>
          </div>`).join('')}
      </div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn ${deny?'danger':'primary'}" onclick="commitGroup('${risk}')">
        ${deny?'Подтвердить недопуск':'Подтвердить и пропустить'}
      </button>
    </div>`);
}
let DROPPED = new Set();
function dropFromGroup(id){
  DROPPED.add(id);
  const el=document.getElementById('ci-'+id); if(el) el.remove();
  const n=document.querySelectorAll('#clist .citem').length;
  toast(`Убрано из группы. Осталось ${n}.`);
}
function commitGroup(risk){
  const items = bulkSet(risk).filter(x=>!DROPPED.has(x.id));
  if(!items.length){ closeModal(); DROPPED=new Set(); toast('Группа пуста — ничего не изменилось.'); return }
  const deny = risk==='red';
  const n = items.length;
  items.forEach(x=>{
    x.status = deny?'denied':'allowed';
    S.log.unshift({
      id:x.id, from:x.from, to:x.to,
      decision: deny?'deny':'allow',
      basis: deny ? x.full : 'анализатор не выявил признаков, резюме просмотрено',
      by:'Соколова Е.С., цензор', at:nowStamp(), group:n,
      act: deny ? String(++ACT_NO) : null
    });
  });
  DROPPED=new Set(); closeModal(); render();
  toast(`${deny?'Не допущено':'Разрешено'}: ${n} ${plural(n,'материал','материала','материалов')}`);
}
function nowStamp(){
  const d=new Date();
  return `28.08.2026 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* ---------------- конвейер оранжевых ---------------- */
function startConveyor(){
  const items = left('orange');
  if(!items.length){ toast('Оранжевых материалов нет.'); return }
  S.conveyor = items.map(x=>x.id);
  openCard(S.conveyor[0]);
}

/* ---------------- экран 3: карточка ---------------- */
function openCard(id){S.openId=id; S.view='card'; render()}
function renderCard(){
  const x = S.queue.find(m=>m.id===S.openId);
  if(!x){ go('queue'); return }
  const inConv = S.conveyor && S.conveyor.includes(x.id);
  const pos = inConv ? S.conveyor.indexOf(x.id)+1 : 0;

  let bodyHTML = '';
  if(x.text){
    bodyHTML = `<div class="body-text">${hlText(x.text, x.hl)}${x.tr?`<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line2)"><div class="top-sub" style="margin-bottom:4px">Перевод (оригинал сохранён)</div>${esc(x.tr)}</div>`:''}</div>`;
  } else if(x.ts){
    bodyHTML = `<div class="body-text"><div class="ts">${
      x.ts.map(([t,s],i)=>`<div class="t">${t}</div><div>${(x.hlts||[]).includes(i)?`<mark${x.risk==='red'?' class="r"':''}>${esc(s)}</mark>`:esc(s)}</div>`).join('')
    }</div>${x.tr?`<div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line2)"><div class="top-sub" style="margin-bottom:4px">Перевод (оригинал сохранён)</div>${esc(x.tr)}</div>`:''}</div>`;
  }
  const framesHTML = x.frames ? `<div class="card"><h3>Раскадровка</h3><div class="ts">${x.frames.map(([t,d])=>`<div class="t">${t}</div><div>${esc(d)}</div>`).join('')}</div></div>` : '';

  document.getElementById('content').innerHTML = `
    ${inConv?`<div class="progress"><span>Разбор подряд · ${pos} из ${S.conveyor.length}</span><span class="pbar"><i style="width:${Math.round(pos/S.conveyor.length*100)}%"></i></span></div>`:''}
    <div class="bar"><button class="btn sm" onclick="go('queue')">← В ленту</button>
      <button class="btn sm" onclick="openContext('${x.id}')">Контекст</button>

      ${x.sample?'<span class="chip a">точечный контроль</span>':''}
      ${x.protected?'<span class="chip a">защищённая переписка</span>':''}
    </div>

    <div class="card">
      <h3>${esc(x.from)} → ${esc(x.to)}</h3>
      <div class="top-sub">${x.id} · ${x.at} · ${esc(x.dir)} · ${esc(x.channel)} · ${esc(x.lang)} · ${esc(x.size)} · ${esc(x.origin)}</div>
    </div>

    <div class="split">

        <div class="card"><h3>Содержание</h3>${bodyHTML}</div>

            <div class="k">Основание</div><div>${esc(x.basis)}</div>

            <div class="k">Рекомендация</div><div>${esc(x.rec)}</div>
          </div>
          ${x.checked?`<div class="note ok" style="margin:12px 0 0">Проверено правил: <b>${x.checked}</b>. Совпадений не найдено: <b>${x.notFound}</b>.</div>`:''}
        </div>
        ${x.protected?`<div class="note warn"><b>Особый режим.</b> Содержание переписки с защитником не раскрывается. Фиксируется только факт и дата.</div>`:''}
        <div class="card">
          <h3>Решение</h3>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <button class="btn primary" onclick="decide('${x.id}','allow')">Разрешить</button>
            <button class="btn danger" onclick="decide('${x.id}','deny')">Не допустить</button>
            ${x.kind==='text' && !x.protected ? `<button class="btn" onclick="openRedact('${x.id}')">Вымарать фрагмент</button>`:''}
            ${x.protected ? '' : `<button class="btn" onclick="передатьОперативнику('${x.id}')">Оперативнику</button>`}
          </div>
          ${x.protected ? '' : `<div class="top-sub" style="margin-top:10px">Передача оперативнику —
            когда решение зависит от сведений, которых у вас нет. Материал уйдёт из ваших стопок.</div>`}
        </div>
      </div>
    </div>`;
}

function decide(id, what, cut){
  const x = S.queue.find(m=>m.id===id); if(!x) return;
  x.status = what==='allow'?'allowed': what==='deny'?'denied':'partial';
  S.log.unshift({
    id:x.id, from:x.from, to:x.to, decision:what,
    basis: what==='deny' ? x.full
         : what==='partial' ? `вымарано фрагментов: ${cut}; остальное пропущено`
         : (x.sample ? 'точечный контроль: решение анализатора подтверждено цензором' : 'материал просмотрен, признаков нарушения не выявлено'),
    by:'Соколова Е.С., цензор', at:nowStamp(), group:1,
    act: what === 'deny' ? String(++ACT_NO) : null
  });

  /* Недопуск цензора тоже порождает акт, и этот акт ждёт подписи начальника
     наравне с актами оперативного сотрудника. */
  if (what === 'deny') {
    сформироватьАктНаПодпись(x, String(ACT_NO),
      { имя: 'Соколова Елена Сергеевна', должность: 'цензор, вольнонаёмный сотрудник' });
  }
  const label = what==='allow'?'Разрешено': what==='deny'?'Не допущено':'Пропущено с изъятием фрагментов';
  // конвейер: сразу следующий
  if(S.conveyor){
    S.conveyor = S.conveyor.filter(i=>i!==id);
    if(S.conveyor.length){ toast(`${label}. Следующий материал — ${S.conveyor.length} ${S.conveyor.length===1?'остался':'осталось'}.`); openCard(S.conveyor[0]); return }
    S.conveyor=null; toast(`${label}. Стопка «Оранжевые» разобрана.`); go('queue'); return;
  }
  toast(label);
  go('queue');
}

/* ---------------- экран 4: вымарывание ---------------- */
function openRedact(id){S.redactId=id; S.redactCut=[]; S.view='redact'; render()}
function splitFrags(t){
  return t.split(/(?<=[.!?])\s+/).filter(Boolean);
}

/* Закрашенный фрагмент в экземпляре адресата: самого текста нет,
   есть полосы по числу и длине слов. Скопировать оттуда нечего. */
function полосы(фрагмент){
  const слова = String(фрагмент).split(/\s+/).filter(Boolean);
  return '<span class="blk-группа" title="изъятый фрагмент">'
    + слова.map(w => `<span class="blk" style="width:${Math.max(1, w.length)}ch"></span>`).join(' ')
    + '</span>';
}
function renderRedact(){
  const x = S.queue.find(m=>m.id===S.redactId);
  if(!x||!x.text){ go('queue'); return }
  const frags = splitFrags(x.text);
  const cut = S.redactCut;

  document.getElementById('content').innerHTML = `
    <div class="bar"><button class="btn sm" onclick="openCard('${x.id}')">← К материалу</button></div>
    <div class="card">
      <h3>Вымарывание фрагмента</h3>
      <div class="top-sub">${esc(x.from)} → ${esc(x.to)} · ${x.id}</div>
    </div>
    <div class="note">Отметьте предложения, которые нужно изъять.
      Слева — оригинал: он хранится целиком, изъятое в нём зачёркнуто и остаётся читаемым.
      Справа — экземпляр адресата: в нём изъятого текста нет, только полосы.</div>
    <div class="split поровну">
      <div class="card">
        <h3>Исходный текст</h3>
        <div class="redact">${frags.map((f,i)=>`<span class="frag ${cut.includes(i)?'cut':''}" onclick="toggleFrag(${i})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFrag(${i})}">${esc(f)}</span> `).join('')}</div>
      </div>
      <div class="card">
        <h3>Что увидит адресат</h3>
        <div class="preview">${frags.map((f,i)=>cut.includes(i)?полосы(f):esc(f)).join(' ')}</div>
        <div class="kv" style="margin-top:14px">
          <div class="k">Изъято</div><div>${cut.length} из ${frags.length}</div>
          <div class="k">Основание</div><div>${esc(x.basis)}</div>
        </div>
        <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap">
          <button class="btn primary" onclick="confirmRedact()" ${cut.length?'':'disabled'}>Подтвердить и пропустить</button>
          <button class="btn" onclick="openCard('${x.id}')">Отмена</button>
        </div>
      </div>
    </div>`;
}
function toggleFrag(i){
  const p = S.redactCut.indexOf(i);
  if(p>=0) S.redactCut.splice(p,1); else S.redactCut.push(i);
  render();
}
function confirmRedact(){
  const n=S.redactCut.length, id=S.redactId;
  S.redactId=null; S.redactCut=[];
  decide(id,'partial',n);
}

/* ---------------- экран 5: журнал ---------------- */
function renderLog(){
  const c = document.getElementById('content');
  if(!S.log.length){
    c.innerHTML = `<div class="empty"><div class="big">${ICON.clock}</div><b>Журнал пуст</b><div>Решения появятся здесь сразу после разбора ленты.</div></div>`;
    return;
  }
  const a=S.log.filter(e=>e.decision==='allow').length;

  c.innerHTML = `

      <div class="stat"><div class="k">Всего решений</div><div class="v tnum">${S.log.length}</div><div class="d">за смену</div></div>

    ${S.log.length>200?`<div class="more"><span class="chip">показаны последние 200 записей из ${S.log.length}</span></div>`:''}`;
}
function entryHTML(e){
  const cls = e.decision==='allow'?'allow': e.decision==='deny'?'deny':'part';
  const word = e.decision==='allow'?'разрешено': e.decision==='deny'?'не допущено':'пропущено с изъятием';
  return `<div class="entry ${cls}">

  </div>`;
}

function applyRevision(id, what){
  const x = S.queue.find(m => m.id === id); if (!x) return;
  const reason = (document.getElementById('revReason') || {}).value || 'причина не указана';
  const прежнее = S.log.find(e => e.id === id);
  x.status = what === 'allow' ? 'allowed' : 'denied';
  S.log.unshift({
    id: x.id, from: x.from, to: x.to, decision: what,
    basis: 'пересмотр решения: ' + reason,
    by: 'Соколова Е.С., цензор', at: nowStamp(), group: 1,
    supersedes: прежнее ? прежнее.at : null,
  });
  closeModal(); render();
  toast('Решение пересмотрено. Прежняя запись сохранена.');
}

/* ====================================================================
   КОНТЕКСТ — ИСТОРИЯ ПЕРЕПИСКИ ЗА ТРИ МЕСЯЦА

   Одно письмо почти ничего не значит. Значит ряд: как часто пишут,
   кому, чем это обычно кончалось, не появился ли адресат впервые.
   Эти сведения лежат в data-history.js за 90 дней и разбираются здесь.

   Контекст нужен одинаково и длинному письму, и короткой фразе:
   у фразы своего содержания почти нет, и кроме истории судить не по чему.
   ==================================================================== */

const H_НАПРАВЛЕНИЕ = ['входящее', 'исходящее'];
const H_НОСИТЕЛЬ = ['бумага', 'электронное'];
const H_РИСК = ['green', 'orange', 'red'];

/* Дата записи: в истории хранится, сколько дней назад это было. */
function hДата(дней){
  const d = new Date(2026, 8, 25 - дней);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
}

/* Вся история человека и та её часть, что с этим же контактом. */
function контекстПереписки(x){
  const все = архивЧеловека(x.pid);
  const сЭтим = все.filter(z => z[3] === x.ci);
  const счёт = список => {
    const c = { вручено: 0, вымарано: 0, недопущено: 0 };
    список.forEach(z => { c[['вручено', 'вымарано', 'недопущено'][z[8]]]++; });
    return c;
  };
  const дни = сЭтим.map(z => z[1]);
  return {
    все, сЭтим,
    решенияВсе: счёт(все),
    решенияСЭтим: счёт(сЭтим),
    первое: дни.length ? Math.max(...дни) : null,
    последнее: дни.length ? Math.min(...дни) : null,
  };
}

/* Короткая сводка одной строкой — её показывают и в разборе у оперативника. */
function сводкаКонтекста(x){
  const к = контекстПереписки(x);
  if (!к.все.length) return '<div class="note warn" style="margin-bottom:0"><b>Переписки за три месяца нет.</b> Это первое отправление этого человека в архиве.</div>';

  const новый = к.сЭтим.length === 0;
  const недоп = к.решенияСЭтим.недопущено;
  const тревожно = новый || недоп > 0;

  return `<div class="note ${тревожно ? 'warn' : 'ok'}" style="margin-bottom:0">
    ${новый
      ? `<b>С этим адресатом переписки раньше не было.</b> У человека за три месяца ${к.все.length}
         ${plural(к.все.length, 'отправление', 'отправления', 'отправлений')}, но все — с другими контактами.`
      : `<b>С этим адресатом за три месяца: ${к.сЭтим.length}
         ${plural(к.сЭтим.length, 'отправление', 'отправления', 'отправлений')}.</b>
         Первое ${hДата(к.первое)}, последнее ${hДата(к.последнее)}.
         ${недоп ? `Не допускалось ${недоп} ${plural(недоп, 'раз', 'раза', 'раз')}.` : 'Недопусков не было.'}
         ${к.решенияСЭтим.вымарано ? `Вымарывалось ${к.решенияСЭтим.вымарано}.` : ''}`}
  </div>`;
}

      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      ${сводкаКонтекста(x)}

      <div class="stats" style="margin-top:16px">
        <div class="stat"><div class="k">Всего за три месяца</div><div class="v tnum">${к.все.length}</div>
          <div class="d">со всеми контактами</div></div>
        <div class="stat"><div class="k">С этим адресатом</div><div class="v tnum">${к.сЭтим.length}</div>
          <div class="d">${к.все.length ? Math.round(к.сЭтим.length / к.все.length * 100) : 0}% переписки</div></div>
        <div class="stat"><div class="k">Не допускалось</div><div class="v tnum">${к.решенияВсе.недопущено}</div>
          <div class="d">по всем контактам</div></div>
        <div class="stat"><div class="k">Вымарывалось</div><div class="v tnum">${к.решенияВсе.вымарано}</div>
          <div class="d">частичное изъятие</div></div>
      </div>

      ${к.сЭтим.length ? `
        <h3 style="margin:18px 0 10px">Переписка с этим адресатом</h3>
        <div class="журнал">
          <table class="журнал-таб" style="min-width:0">
            <thead><tr><th>Дата</th><th>Направление</th><th>Канал</th><th>Объём</th><th>Оценка</th><th>Решение</th></tr></thead>
            <tbody>${лента}</tbody>
          </table>
        </div>
        ${к.сЭтим.length > 20 ? `<div class="top-sub" style="margin-top:8px">показаны последние 20 из ${к.сЭтим.length}</div>` : ''}` : ''}

   ОСТАЛЬНЫЕ РОЛИ
   Оперативник, начальник учреждения, контроль переговоров.
   Данные — из data-roles.js, прототип их не выдумывает.
   ==================================================================== */

const ROL = window.OSNOVA_ROLES || { events:[], groups:[], calls:[], staff:[], services:[], audit:[], complaints:[], autoBreaks:[], units:[], facility:{} };

/* Досье оперативника — это население учреждения, а не отдельный список.
   Активность считается из материалов смены, поэтому цифра настоящая. */
ROL.persons = POP.люди;
/* Пользуется ли человек сервисами ЗТ — вопрос продавца, а не оперативного
   сотрудника. Ему важно другое: было ли за человеком что-то замечено.
   Поэтому строка отвечает на вопрос «что с ним не так», а если ничего —
   так и говорит. Порядок от тревожного к спокойному. */
function активностьЧеловека(p){
  const заСмену = (S.queue || []).filter(m => m.pid === p.id).length;
  const с = сигналыЧеловека(p.id);
  const св = опасныеСвязи(p);
  const учёт = ПРОФУЧЁТ.filter(z => !z.removed && z.pid === p.id).length;
  const части = [];

  if (заСмену) части.push(заСмену + ' ' + plural(заСмену, 'материал', 'материала', 'материалов') + ' за смену');
  if (с.красные.length) части.push('красных сигналов за три месяца: ' + с.красные.length);
  else if (с.недопуски.length) части.push('недопусков за три месяца: ' + с.недопуски.length);
  if (учёт) части.push('на профилактическом учёте');
  if (св.соучастники) части.push('общий контакт с соучастником');
  else if (св.общие) части.push('общих контактов: ' + св.общие);

  if (части.length) return части.join(' · ');
  return с.всего
    ? 'за три месяца без сигналов, отправлений ' + с.всего
    : 'переписки за три месяца нет';
}

  const n = Number(String(pid).replace(/\D/g, ''));

    contact: c.contact, risk: c.riskLevel || 'orange', reason: причина, status: 'open' });
  closeModal(); render();
  toast('Разговор прекращён. Событие добавлено в журнал смены.');

/* Три месяца потока — то, чего не видно за одной сменой. */
function блокИстории(){
  const с = HIST.сводка;

/* ====================================================================
   ОПЕРАТИВНИК — углублённая часть
   Состав групп, прослушивание в реальном времени, граф связей,
   история коммуникаций человека, отчёты и подборки.
   ==================================================================== */

const ОПЕР = {
  составы: {},      // id группы → массив id людей
  прослушка: [],    // кто из моих групп говорит прямо сейчас
  индексТелефонов: {},
};

function собратьОперативника(){
  const люди = ROL.persons;
  if (!люди.length) return;

  // Состав групп: берём срез людей под заявленный размер
  let i = 0;
  LIVE.groups.forEach(g => {
    const n = Math.min(g.count, 14);
    ОПЕР.составы[g.id] = люди.slice(i, i + n).map(p => p.id);
    i = (i + n) % Math.max(1, люди.length - n);
  });

  // События привязываем к настоящим людям из населения: имена в событиях
  // были написаны вручную и ни с кем в базе не совпадали.
  LIVE.events.forEach((e, n) => {
    const p = люди[(n * 37) % люди.length];
    if (!p) return;
    e.pid = p.id;
    e.person = p.name;
    e.unit = p.unit;
  });

  // Индекс телефонов — из него собирается граф связей
  люди.forEach(p => p.contacts.forEach(c => {
    (ОПЕР.индексТелефонов[c.phone] = ОПЕР.индексТелефонов[c.phone] || []).push(p.id);
  }));

  // Прослушивание: людей из группы привязываем к разговорам, идущим сейчас
  const g = LIVE.groups.find(x => x.listen);
  if (!g) return;
  g.on = true;
  const члены = (ОПЕР.составы[g.id] || []).slice(0, 3).map(id => люди.find(p => p.id === id)).filter(Boolean);
  const активные = LIVE.calls.filter(c => !c.ended).slice(0, члены.length);
  ОПЕР.прослушка = члены.map((p, k) => {
    const c = активные[k];
    if (!c) return null;
    c.person = p.name.split(' ').slice(0, 2).join(' ');
    c.watch = g.id;
    return { call: c, person: p, groupId: g.id };
  }).filter(Boolean);
}

function прослушкаСейчас(){
  const g = LIVE.groups.find(x => x.listen);
  if (!g || !g.on) return [];
  return ОПЕР.прослушка.filter(x => !x.call.ended);
}

/* ---------------- Досье: связи и история ---------------- */

function связиЧеловека(p){
  const связи = [];
  p.contacts.forEach(c => {
    const другие = (ОПЕР.индексТелефонов[c.phone] || []).filter(id => id !== p.id);
    if (другие.length) связи.push({ контакт: c, люди: другие.map(id => ROL.persons.find(x => x.id === id)).filter(Boolean) });
  });
  return связи;
}

/* Точное совпадение по номеру человека: материал больше не ищется по фамилии. */
function историяЧеловека(p){
  return S.queue.filter(m => m.pid === p.id).slice(0, 10);
}

/* ---------------- фраза дня ---------------- */

function фразаДня(дата){
  const d = дата ? new Date(дата) : new Date();
  const привязки = REF.phrasesPinned || {};
  const мд = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const сГодом = d.getFullYear() + '-' + мд;
  if (привязки[сГодом]) return привязки[сГодом];
  if (привязки[мд]) return привязки[мд];
  const список = REF.phrases || [];
  if (!список.length) return '';
  const день = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);   // 1..366
  return список[(день - 1) % список.length];
}

/* «Соколова Елена Сергеевна» → «Елена Сергеевна» */
function имяОтчество(фио){
  const ч = String(фио || '').trim().split(/[ ]+/);
  return ч.length >= 3 ? ч[1] + ' ' + ч[2] : (ч[1] || ч[0] || '');
}

/* Фраза со строчной буквы — продолжение обращения, с прописной — сама по себе. */
function текстФразы(ф, п){
  const первая = String(ф).charAt(0);
  const нужноОбращение = первая && первая === первая.toLowerCase() && первая !== первая.toUpperCase();
  const ио = имяОтчество(п.name);
  return (нужноОбращение && ио)
    ? `<span class="фраза-имя">${esc(ио)}</span>, ${esc(ф)}`
    : esc(ф);
}

function блокФразы(){
  const п = профиль();
  if (!(п.settings && п.settings.phraseOfDay)) return '';
  const ф = фразаДня();
  if (!ф) return '';
  return `
    <div class="фраза">
      <div class="фраза-текст">${текстФразы(ф, п)}</div>
      <button class="btn sm" onclick="настройка('phraseOfDay', false)">Отключить</button>
    </div>`;
}

/* ---------------- праздники в канале ---------------- */

function праздникДня(дата){
  const d = дата ? new Date(дата) : new Date();
  const мд = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const п = REF.holidays || {};
  return п[d.getFullYear() + '-' + мд] || п[мд] || null;
}

function ближайшийПраздник(от){
  const старт = от ? new Date(от) : new Date();
  for (let i = 1; i <= 366; i++) {
    const d = new Date(старт.getFullYear(), старт.getMonth(), старт.getDate() + i);
    const п = праздникДня(d);
    if (п) return { ...п, дата: d, через: i };
  }
  return null;
}

const МЕСЯЦЫ = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const датаСловами = d => `${d.getDate()} ${МЕСЯЦЫ[d.getMonth()]}`;

function блокПраздника(){
  const сегодня = праздникДня();
  const арт = REF.holidayArt || {};

  if (сегодня) return `
    <div class="праздник">
      <div class="праздник-арт">${арт[сегодня.img] || ''}</div>
      <div>
        <div class="праздник-загл">${esc(сегодня.title)}</div>
        <div class="праздник-текст">${esc(сегодня.text)}</div>
      </div>
    </div>`;

  const б = ближайшийПраздник();
  if (!б) return '';
  return `
    <div class="card" style="display:flex; align-items:center; gap:16px; flex-wrap:wrap">
      <div style="width:66px; flex:none">${арт[б.img] || ''}</div>
      <div style="flex:1; min-width:200px">
        <div style="font-weight:650">Ближайший праздник — ${esc(датаСловами(б.дата))}</div>
        <div class="top-sub">${esc(б.title)} · через ${б.через} ${склон(б.через, 'день', 'дня', 'дней')}</div>
      </div>
      <button class="btn sm" onclick="показатьПраздник('${esc(б.title)}')">Посмотреть поздравление</button>
    </div>`;
}

function склон(n, a, b, c){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
  return c;
}

function показатьПраздник(заголовок){
  const все = Object.values(REF.holidays || {});

  const арт = (REF.holidayArt || {})[п.img] || '';

function сохранитьЗапись(){
  const v = id => (document.getElementById(id) || {}).value || '';
  if (!ЖУРНАЛ.выбран) { toast('Выберите заключённого — на кого или от кого корреспонденция'); return; }

  const входящее = v('жНаправление') === 'входящее';
  const макс = ЖУРНАЛ.записи.reduce((m, z) => Math.max(m, z.n), 1000);
  ЖУРНАЛ.записи.unshift({
    n: макс + 1,
    date: v('жДата'),
    source: v('жИсточник'),
    dir: v('жНаправление'),
    from: входящее ? сторона : ЖУРНАЛ.выбран.name,
    to: входящее ? ЖУРНАЛ.выбран.name : сторона,
    pid: ЖУРНАЛ.выбран.id,
    kind: v('жВид'),
    pages: Math.max(1, parseInt(v('жСтраниц'), 10) || 1),
    decision: v('жРешение'),
    by: (профиль().name || '').split(' ').slice(0, 2).map((x, i) => i ? x[0] + '.' : x).join(' '),
    note: v('жПримечание'),

  ЖУРНАЛ.выбран = null;
  closeModal(); render();
  toast('Запись внесена в журнал под номером ' + (макс + 1));

/* ====================================================================
   НАЧАЛЬНИК УЧРЕЖДЕНИЯ

   Три вещи, которые может решить только он и никто другой:
     1. подписать акт недопуска, подготовленный вольнонаёмным цензором;
     2. назначить режим доверия — это решение о пропускной способности
        учреждения, а не настройка чужого рабочего места;
     3. распорядиться людьми там, где некомплект бьёт по срокам.

   Расчёт нагрузки берётся из данных (ROL.throughput) и совпадает
   с «Экономикой смены» в спеке. Числа лежат в одном месте, чтобы экран
   и документ не разошлись.
   ==================================================================== */

const ПРОП = ROL.throughput || null;
const НАГРУЗКА_УЧАСТКОВ = ROL.workload || [];
const АКТЫ = ROL.acts || [];

/* Сколько минут займёт объём за трёхдневное окно при заданном режиме. */
function минутыЗаОкно(объём, режим){
  if (!ПРОП) return 0;
  const с = ПРОП.секунды[режим] || ПРОП.секунды.manual;
  const д = ПРОП.доли;
  const зел = объём * д.green, ор = объём * д.orange, кр = объём * д.red;
  const выборка = с.sample ? зел * ПРОП.выборка * с.sample : 0;
  return Math.round((зел * с.green + ор * с.orange + кр * с.red + выборка) / 60);
}
function доляБюджета(мин){ return ПРОП ? Math.round(мин / ПРОП.бюджетМин * 100) : 0; }

/* Сверка выборки идёт после доставки, поэтому в норматив трёх суток
   не входит. Считаем её отдельно и показываем отдельно. */
function минутыВыборки(объём){
  if (!ПРОП) return 0;
  return Math.round(объём * ПРОП.доли.green * ПРОП.выборка * ПРОП.выборкаСек / 60);
}

/* Объём окна: сегодняшний набор плюс два обычных дня. */
function объёмОкна(){ return S.total + 200 * 2; }

function актовЖдёт(){ return АКТЫ.filter(a => a.status === 'waiting').length; }
function актовПросрочено(){ return АКТЫ.filter(a => a.status === 'waiting' && a.overdue).length; }

function склАкт(n){
  const о = n % 10, с = n % 100;
  if (о === 1 && с !== 11) return 'акт';
  if (о >= 2 && о <= 4 && (с < 12 || с > 14)) return 'акта';
  return 'актов';
}

/* ---------------- пропускная способность ---------------- */

function блокПропускной(){
  if (!ПРОП) return '';
  const объём = объёмОкна();
  const мин = минутыЗаОкно(объём, S.trust);
  const доля = доляБюджета(мин);
  const влезает = мин <= ПРОП.бюджетМин;
  const режимы = ['manual', 'half', 'full'];

  return `
    <h2 class="sect">Пропускная способность</h2>
    <div class="card">
      <div class="progress">
        <span>Трёхдневное окно: <b>${объём}</b> материалов, режим «${esc(ПРОП.режимЛейбл[S.trust])}»</span>
        <span class="pbar"><i style="width:${Math.min(доля, 100)}%; background:${влезает ? 'var(--success)' : 'var(--danger)'}"></i></span>
        <span class="tnum"><b style="color:${влезает ? 'var(--success)' : 'var(--danger)'}">${мин} мин</b> из ${ПРОП.бюджетМин}</span>
      </div>

      <div class="note ${влезает ? 'ok' : 'warn'}">
        ${влезает
          ? `<b>Норматив выдерживается.</b> Запас — ${ПРОП.бюджетМин - мин} минут, это ${100 - доля}% бюджета.
             Ни одно письмо не выходит за трёхдневный срок.`
          : `<b>Норматив не выдерживается.</b> Не хватает ${мин - ПРОП.бюджетМин} минут за окно.
             Часть корреспонденции выйдет за трёхдневный срок.`}
      </div>

      <div class="note" style="margin-bottom:18px">Сверх этого — точечный контроль:
        каждый двадцатый зелёный помечается для сверки, это ещё около <b>${минутыВыборки(объём)} мин</b> за окно.
        В норматив не входит — помеченные материалы уходят вместе со всеми, а смотрят их по возможности.</div>

      <h3 style="margin-top:20px">Чего стоит каждый режим доверия</h3>
      <p style="color:var(--muted); margin:0 0 12px; font-size:14.5px">
        Режим выбирает цензор на своём рабочем месте. Здесь видно, во что каждый
        из них обходится учреждению по времени.</p>

      ${режимы.map(р => {
        const м = минутыЗаОкно(объём, р);
        const влез = м <= ПРОП.бюджетМин;
        return `
        <div class="opt ${S.trust === р ? 'on' : ''}">
          <b>${esc(ПРОП.режимЛейбл[р])} — ${м} мин из ${ПРОП.бюджетМин}
            <span class="chip ${влез ? 'g' : 'r'}" style="margin-left:8px">${влез ? 'укладывается' : 'не укладывается'}</span>
            ${S.trust === р ? '<span class="chip a" style="margin-left:6px">выбран сейчас</span>' : ''}</b>
          <span>${esc(ПРОП.режимПояснение[р])}</span>
        </div>`;
      }).join('')}

      <h3 style="margin-top:20px">Если объём вырастет</h3>
      <div class="журнал" style="margin-top:10px">
        <table class="журнал-таб" style="min-width:0">
          <thead><tr><th>Сценарий трёх дней</th><th>Объём</th>
            ${режимы.map(р => `<th>${esc(ПРОП.режимЛейбл[р])}</th>`).join('')}</tr></thead>
          <tbody>
            ${ПРОП.сценарии.map(с => `
              <tr>
                <td>${esc(с.титул)}<div class="top-sub">${esc(с.расклад)}</div></td>
                <td class="tnum">${с.объём}</td>
                ${режимы.map(р => {
                  const м = минутыЗаОкно(с.объём, р);
                  const влез = м <= ПРОП.бюджетМин;
                  return `<td class="tnum" style="color:${влез ? 'var(--success)' : 'var(--danger)'}">
                    ${м} мин<div class="top-sub">${доляБюджета(м)}%</div></td>`;
                }).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="note" style="margin-bottom:0">Удвоение потока выдерживает только полное доверие.
        В ручном режиме учреждение выбивается из норматива уже на сегодняшнем объёме с одним пиковым днём.</div>
    </div>`;
}

/* ====================================================================
   АКТ О НЕДОПУСКЕ И РЕЕСТР АКТОВ — бланки документов

   Акт оформляется как организационно-распорядительный документ по
   ГОСТ Р 7.0.97-2016. Состав реквизитов:
     08 — наименование организации (с вышестоящей);
     10 — наименование вида документа (АКТ);
     11 — дата документа;
     12 — регистрационный номер;
     13 — место составления;
     16 — гриф утверждения (начальник учреждения, справа вверху);
     17 — заголовок к тексту;
     18 — текст (вводная часть: основание и кто составил; констатирующая);
     22 — подпись;
     отметка об ознакомлении — внизу, под расписку.

   Существо — статья 91 УИК РФ и Правила внутреннего распорядка
   исправительных учреждений (приказ Минюста России от 04.07.2022 № 110).
   Номер конкретного пункта ПВР в бланк не подставляется: он должен быть
   выверен юристом учреждения и хранится в данных (поле norm).

   Печать: один акт — один лист. Реестр — отдельный документ.
   ==================================================================== */

/* «Саидов Бахром Анварович» → «Б.А. Саидов» */
function инициалы(фио){
  const ч = String(фио || '').trim().split(/\s+/);
  if (ч.length >= 3) return ч[1][0] + '.' + ч[2][0] + '. ' + ч[0];
  if (ч.length === 2) return ч[1][0] + '. ' + ч[0];
  return ч[0] || '';
}

const ЕДИНИЦЫ = ['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять',
  'десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать',
  'шестнадцать','семнадцать','восемнадцать','девятнадцать'];
const ДЕСЯТКИ = ['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
const СОТНИ = ['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];

/* Число прописью — в документах количество дублируется словами. */
function числоПрописью(n){
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n > 999) return String(n);
  const с = СОТНИ[Math.floor(n / 100)];
  const о = n % 100;
  const х = о < 20 ? ЕДИНИЦЫ[о]
    : (ДЕСЯТКИ[Math.floor(о / 10)] + (о % 10 ? ' ' + ЕДИНИЦЫ[о % 10] : ''));
  return [с, о ? х : (n ? '' : ЕДИНИЦЫ[0])].filter(Boolean).join(' ');
}

/* Дата документа — та же, что у смены в шапке прототипа. */
const ДАТА_СМЕНЫ = '28.08.2026';
function сегодняДок(){ return ДАТА_СМЕНЫ; }

/* ---------- приведение к единому виду ----------
   Акт печатают из двух мест: цензор из журнала решений и начальник
   из очереди на подпись. Данные разные, бланк один. */

function актИзЖурнала(e){
  const m = S.queue.find(x => x.id === e.id) || {};
  const чел = m.pid ? POP.поId[m.pid] : null;
  const входящее = String(m.dir || '').toLowerCase().indexOf('вход') === 0;
  return {
    номер: e.act || '—',
    дата: сегодняДок(),
    регНомер: e.id,
    поступило: m.at ? ДАТА_СМЕНЫ + ' ' + m.at : '—',
    вид: m.channel || 'письмо',
    направление: входящее ? 'входящее' : 'исходящее',
    отправитель: e.from,
    получатель: e.to,
    осуждённый: чел ? чел.name : (входящее ? e.to : e.from),
    отряд: m.unit || '—',
    норма: У().норма + '; Правила внутреннего распорядка, утверждённые '
         + 'приказом Минюста России от 04.07.2022 № 110',
    решение: У().решениеАкта,
    установлено: m.sum || e.basis,
    мотив: m.full || e.basis,
    составилДолжность: e.byPost || 'Цензор',
    составил: (e.by || '').split(',')[0].trim() || профиль().name,
  };
}

function актИзОчереди(a){
  const входящее = a.dir === 'входящее';
  return {
    номер: a.id.replace(/^АКТ-/, ''),
    дата: сегодняДок(),
    регНомер: a.material,
    поступило: a.at,
    вид: a.channel,
    направление: a.dir,
    отправитель: входящее ? a.counterpart : a.person,
    получатель: входящее ? a.person : a.counterpart,
    осуждённый: a.person,
    отряд: a.unit,
    норма: У().норма + '; Правила внутреннего распорядка, утверждённые '
         + 'приказом Минюста России от 04.07.2022 № 110',
    решение: У().решениеАкта,
    установлено: a.ground,
    мотив: a.reason,
    /* Акт мог составить не цензор: недопуск бывает и решением оперативного
       сотрудника. В бланке должен стоять тот, кто его составил на самом деле. */
    составилДолжность: a.byPost
      ? a.byPost.charAt(0).toUpperCase() + a.byPost.slice(1)
      : 'Цензор',
    составил: a.by && a.by.indexOf(' ') > 0 ? a.by : 'Соколова Елена Сергеевна',
  };
}
