/* ====================================================================
   ПЕРЕДАЧА МАТЕРИАЛА ОПЕРАТИВНОМУ СОТРУДНИКУ

   Анализатор раскладывает по стопкам, но подозрение бывает и у зелёного:
   цензор знает контекст, которого у машины нет. Поэтому передать можно
   материал любой стопки.

   Что происходит с материалом:
     — он уходит из стопок цензора и ждёт решения оперативника;
     — срок по нему продолжает идти, поэтому у передачи видно время;
     — решение принимает оперативник: допустить или не допустить;
     — недопуск здесь, как и у цензора, порождает акт на подпись.

   Приобщение к делу — отдельное действие, а не третий вариант решения.
   Часто письмо как раз пропускают, чтобы переписка продолжалась, а копию
   кладут в дело. Поэтому «прикрепить к делу» сочетается с любым решением.
   ==================================================================== */

const ДЕЛА = (ROL.cases || []).map(d => ({ ...d }));

/* Приобщение к досье — не то же, что приобщение к делу.
   Оперативное дело заведено не на каждого, а досье есть у любого
   человека в контуре. Приобщённый материал остаётся в досье и всплывает,
   когда этого человека откроют в следующий раз — даже если дела нет
   и заводить его пока не за что. */
const ДОСЬЕ_МАТЕРИАЛЫ = {};
function вДосье(pid){ return ДОСЬЕ_МАТЕРИАЛЫ[pid] || []; }

function переданные(){ return S.queue.filter(x => x.status === 'handed'); }
function решённыеОперативником(){ return S.queue.filter(x => x.opDecision); }

  const ждут = переданные();
  ждут.forEach(x => записатьРешениеОперативника(x, 'deny', ''));
  closeModal(); render();
  toast(`Не допущено: ${ждут.length}. Акты сформированы и ушли начальнику на подпись,
    материалы — в архив цензора.`);
}

/* Разбор переданного: содержимое целиком, решение и приобщение к делу. */

  const тело = x.ts
    ? `<div class="ts">${x.ts.map(([t, s], i) =>
        `<div class="t tnum">${esc(t)}</div><div>${x.hlts.includes(i) ? `<mark>${esc(s)}</mark>` : esc(s)}</div>`).join('')}</div>`
    : `<div class="body-text">${hlText(x.text || '—', x.hl)}</div>`;

  const свои = ДЕЛА.filter(d => d.pid === x.pid);
  const прочие = ДЕЛА.filter(d => d.pid !== x.pid);

  modal(`
    <div class="mh">
      <div><h3>Материал от цензора</h3>
        <div class="top-sub">${esc(x.from)} → ${esc(x.to)} · ${esc(x.id)} · ${esc(x.unit)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note"><b>${esc(x.handBy || 'Цензор')}:</b> ${esc(x.handNote || '')}</div>

      <h3 style="margin:18px 0 10px">Контекст переписки</h3>
      ${сводкаКонтекста(x)}

      <div class="card" style="background:var(--bg)">
        <h3>Что сказал анализатор</h3>
        <div class="kv">
          <div class="k">Оценка</div>
          <div><span class="chip ${RISK_LETTER[x.risk]}">${esc(RISK_ONE[x.risk])}</span></div>
          <div class="k">Резюме</div><div>${esc(x.sum)}</div>
          <div class="k">Основание</div><div>${esc(x.basis)}</div>
        </div>
      </div>

      <h3 style="margin:18px 0 10px">Материал</h3>
      ${тело}
      ${x.tr ? `<h3 style="margin:18px 0 10px">Перевод</h3><div class="body-text">${esc(x.tr)}</div>` : ''}

      <div class="note">Материал можно оставить в досье
        <b>${esc((POP.поId[x.pid] || {}).name || x.to)}</b> — кнопка «Добавить в досье» внизу.
        Досье есть у каждого, дело — не у каждого. Приобщённое к досье всплывёт,
        когда вы откроете этого человека в следующий раз.</div>

      <h3 style="margin:18px 0 10px">Приобщить к делу</h3>
      <p style="color:var(--muted); margin:0 0 10px; font-size:14.5px">
        Приобщение не заменяет решения по письму. Письмо можно и пропустить,
        и приобщить копию — переписка при этом продолжается.</p>
      <label class="opt on" id="case-none" onclick="выбратьДело('')">
        <b>Не приобщать</b><span>Решение по письму принимается без документирования</span></label>
      ${свои.map(d => `
        <label class="opt" id="case-${d.id}" onclick="выбратьДело('${d.no}')">
          <b>${esc(d.no)} — ${esc(d.title)}</b>
          <span>${esc(d.person)}, ${esc(d.unit)} · открыто ${esc(d.opened)} · приобщено документов: ${d.attached}</span></label>`).join('')}
      ${свои.length ? '' : `<div class="note warn">На этого человека дела не заведено.
        Можно приобщить к делу по другому фигуранту, если материал касается его.</div>`}
      ${прочие.slice(0, 4).map(d => `
        <label class="opt" id="case-${d.id}" onclick="выбратьДело('${d.no}')">
          <b>${esc(d.no)} — ${esc(d.title)}</b>
          <span>${esc(d.person)}, ${esc(d.unit)} · открыто ${esc(d.opened)}</span></label>`).join('')}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <span id="досьеМесто">${кнопкаДосье(x)}</span>
      <button class="btn danger" onclick="решениеОперативника('${x.id}','deny')">Не допустить</button>
      <button class="btn primary" onclick="решениеОперативника('${x.id}','allow')">Допустить</button>
    </div>`);

/* Приобщение к досье не является решением по письму: решений по-прежнему два.
   Поэтому кнопка срабатывает сразу и окно не закрывает — дальше сотрудник
   всё равно выбирает «допустить» или «не допустить». */
function кнопкаДосье(x){
  return вДосьеУже(x)
    ? '<span class="chip g" title="Материал приобщён к досье">в досье</span>'
    : `<button class="btn" onclick="добавитьВДосье('${x.id}')">Добавить в досье</button>`;
}

function вДосьеУже(x){
  return (ДОСЬЕ_МАТЕРИАЛЫ[x.pid] || []).some(з => з.id === x.id);
}

function добавитьВДосье(id){
  const x = S.queue.find(m => m.id === id); if (!x || вДосьеУже(x)) return;
  (ДОСЬЕ_МАТЕРИАЛЫ[x.pid] = ДОСЬЕ_МАТЕРИАЛЫ[x.pid] || []).unshift({
    id: x.id,
    at: nowStamp(),
    by: профиль().name,
    /* Решение по письму ещё не принято — оно допишется, когда сотрудник его примет. */
    решение: 'решение не принято',
    резюме: x.sum,
    записка: x.handNote || '',
    дело: S.выбранноеДело || null,
  });
  x.toDossier = true;
  const место = document.getElementById('досьеМесто');
  if (место) место.innerHTML = кнопкаДосье(x);
  toast('Приобщено к досье: ' + ((POP.поId[x.pid] || {}).name || x.to));
}

function выбратьДело(no){
  S.выбранноеДело = no;
  document.querySelectorAll('.mb .opt').forEach(el => el.classList.remove('on'));
  const цель = no
    ? [...document.querySelectorAll('.mb .opt')].find(el => el.innerText.indexOf(no) === 0)
    : document.getElementById('case-none');
  if (цель) цель.classList.add('on');
}

/* Одно решение по одному материалу. Здесь же формируется акт: при недопуске
   запись в журнале получает номер акта, а сам акт уходит начальнику на подпись.
   Материал при этом возвращается в архив цензора с пометкой, кто решил. */
function записатьРешениеОперативника(x, что, дело){
  x.opDecision = что;
  x.opCase = дело || null;
  x.opAt = nowStamp();

  const записьДосье = (ДОСЬЕ_МАТЕРИАЛЫ[x.pid] || []).find(з => з.id === x.id);
  if (записьДосье) {
    записьДосье.решение = что === 'allow' ? 'допущено' : 'не допущено';
    if (дело) записьДосье.дело = дело;
  }
  x.status = что === 'allow' ? 'allowed' : 'denied';
  if (дело) { const d = ДЕЛА.find(z => z.no === дело); if (d) d.attached++; }

  const номерАкта = что === 'deny' ? String(++ACT_NO) : null;

  /* Решение возвращается в журнал цензора: она должна видеть, чем кончилось. */
  S.log.unshift({
    id: x.id, from: x.from, to: x.to,
    decision: что,
    basis: (что === 'deny' ? 'решение оперативного сотрудника: не допускать' : 'решение оперативного сотрудника: допустить')
      + (дело ? '; приобщено к делу ' + дело : ''),
    by: профиль().name + ', оперативный сотрудник',
    byPost: 'Оперативный сотрудник',
    at: nowStamp(), group: 1,
    act: номерАкта,
  });

  if (номерАкта) сформироватьАктНаПодпись(x, номерАкта);
  return номерАкта;
}

/* Акт ложится на стол начальнику. Пока он не подписан, недопуск
   документально не оформлен — материал задержан, а основания на бумаге нет. */
function сформироватьАктНаПодпись(x, номер, кем){
  /* Акт составляет тот, кто принял решение о недопуске: и цензор, и оперативный
     сотрудник. Подписывает в обоих случаях начальник учреждения. */
  const кто = кем || { имя: профиль().name, должность: 'оперативный сотрудник' };
  const чел = POP.поId[x.pid] || {};
  const входящее = String(x.dir || '').toLowerCase().indexOf('вход') === 0;
  АКТЫ.unshift({
    id: 'АКТ-' + номер,
    material: x.id,
    at: ДАТА_СМЕНЫ + ' ' + (x.at || ''),
    pid: x.pid,
    person: чел.name || (входящее ? x.to : x.from),
    unit: x.unit || '—',
    counterpart: входящее ? x.from : x.to,
    dir: входящее ? 'входящее' : 'исходящее',
    channel: x.kindLabel || 'письмо',
    norm: x.basis || У().норма,
    ground: x.sum,
    reason: x.full || x.sum,
    by: кто.имя,
    byPost: кто.должность,
    due: 'завтра 18:00',
    overdue: false,
    status: 'waiting',
  });
}

function решениеОперативника(id, что){
  const x = S.queue.find(m => m.id === id); if (!x) return;
  const дело = S.выбранноеДело || '';

  const вДосьеБыло = (ДОСЬЕ_МАТЕРИАЛЫ[x.pid] || []).some(з => з.id === x.id);
  записатьРешениеОперативника(x, что, дело);

  S.выбранноеДело = '';
  closeModal(); render();
  const куда = [вДосьеБыло ? 'досье' : '', дело ? 'дело ' + дело : ''].filter(Boolean).join(' и ');
  toast((что === 'allow' ? 'Допущено' : 'Не допущено, акт уйдёт на подпись')
    + (куда ? '. Копия приобщена в ' + куда : ''));
}

/* ====================================================================
   АТТЕСТАЦИЯ

   В профиле самого сотрудника признака нет: человеку он ни к чему.
   Проставляет его начальник учреждения в «Доступах сотрудников».

   Одно исключение — цензор. Она может отметить себя вольнонаёмной сама,
   не дожидаясь начальника. С неаттестованным сотрудником заключается
   договор, поэтому такой случай уходит региональному представителю ЗТ
   письмом — автоматически, в тот же момент.
   ==================================================================== */

const ПРЕДСТАВИТЕЛЬ = REF.rep || null;

/* Письмо представителю. В жизни оно уходит молча; в прототипе показываем
   его целиком, чтобы было видно, что именно отправлено и кому. */
function письмоПредставителю(фио, должность){
  const ф = ROL.facility || {};
  return {
    кому: ПРЕДСТАВИТЕЛЬ ? ПРЕДСТАВИТЕЛЬ.email : '—',
    тема: 'Неаттестованный сотрудник: ' + фио + ', ' + (ф.short || 'учреждение'),
    текст: фио + ', ' + должность + ' ' + (ф.short || '') + ', '
      + 'отмечен в ОСНОВЕ как вольнонаёмный сотрудник.\n\n'
      + 'С вольнонаёмными сотрудниками заключается договор. '
      + 'Просим связаться с учреждением для оформления.\n\n'
      + 'Учреждение: ' + (ф.full || '') + '\n'
      + 'Вышестоящий орган: ' + (ф.parent || '') + '\n'
      + 'Дата отметки: ' + nowStamp(),
  };
}

function уведомитьПредставителя(фио, должность){
  if (!ПРЕДСТАВИТЕЛЬ) {
    toast('Представитель ЗТ не назначен в админке — уведомление не ушло');
    return;
  }
  const п = письмоПредставителю(фио, должность);
  modal(`
    <div class="mh">
      <div><h3>Уведомление отправлено</h3>
        <div class="top-sub">${esc(ПРЕДСТАВИТЕЛЬ.role)} ${esc(ПРЕДСТАВИТЕЛЬ.name)} · ${esc(ПРЕДСТАВИТЕЛЬ.region)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note ok" style="margin-top:0"><b>Письмо ушло автоматически.</b>
        С вольнонаёмными сотрудниками заключается договор, поэтому представителя
        уведомляют сразу, а не в конце месяца.</div>
      <div class="kv">
        <div class="k">Кому</div><div>${esc(п.кому)}</div>
        <div class="k">Телефон</div><div>${esc(ПРЕДСТАВИТЕЛЬ.phone)}</div>
        <div class="k">Тема</div><div>${esc(п.тема)}</div>
      </div>
      <div class="body-text" style="margin-top:14px; white-space:pre-wrap">${esc(п.текст)}</div>
    </div>
    <div class="mf"><button class="btn primary" onclick="closeModal()">Понятно</button></div>`);
}

/* ---------- цензор отмечает себя сама ---------- */

function отметитьСебяВольнонаёмной(вольнонаёмная){
  const п = профиль();
  п.attested = !вольнонаёмная;
  п.employment = п.attested ? 'аттестованный сотрудник' : 'вольнонаёмный сотрудник';
  render();
  if (вольнонаёмная) уведомитьПредставителя(п.name, п.post);
  else toast('Отметка снята. Представителю ничего не отправляется.');
}

/* ---------- начальник проставляет аттестацию ---------- */

function сменитьАттестацию(id){
  const s = LIVE.staff.find(x => x.id === id); if (!s) return;
  s.attested = !s.attested;
  render();
  if (s.attested) toast(s.name + ' — аттестованный сотрудник');
  else уведомитьПредставителя(s.name, s.role);
}

/* ============ 1. УПРАВЛЕНИЕ КОНТАКТОМ ============
   Раньше канал переключался нажатием на метку: без основания, без срока
   и без следа. Между тем это ограничение доступности связи для человека,
   и оно должно быть обосновано и обозримо. */

const СРОКИ_ОГРАНИЧЕНИЯ = [
  ['7', 'на 7 суток'],
  ['30', 'на 30 суток'],
  ['0', 'бессрочно, до отдельного решения'],
];
const ОСНОВАНИЯ_ОГРАНИЧЕНИЯ = [
  'Контакт не подтверждён, заявленное родство не проверено',
  'Номер встречается у нескольких человек',
  'Сработало правило анализатора по этому контакту',
  'По материалам оперативной проверки',
  'По письменному указанию начальника учреждения',
];

function состояниеКонтакта(pid, i){
  const ключ = pid + ':' + i;
  LIVE.контакты[ключ] = LIVE.контакты[ключ] || { active: true, phone: false, video: false, message: false };
  return LIVE.контакты[ключ];
}

function открытьУправлениеКонтактом(pid, i){
  const p = ROL.persons.find(x => x.id === pid); if (!p) return;
  const c = p.contacts[i]; if (!c) return;
  const s = состояниеКонтакта(pid, i);
  S.черновикКонтакта = { основание: ОСНОВАНИЯ_ОГРАНИЧЕНИЯ[0], срок: '30' };

  const каналы = [['phone', 'телефон'], ['video', 'видеосвязь'], ['message', 'сообщения']];

  modal(`
    <div class="mh">
      <div><h3>${esc(c.name)}</h3>
        <div class="top-sub">${esc(c.role)} · ${esc(c.phone)} · контакт ${esc(p.name)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note warn" style="margin-top:0"><b>Это управление доступностью контакта в ОСНОВЕ,</b>
        а не правка заявления заключённого и не изменение перечня номеров.
        Основание и срок сохраняются в журнале и видны при проверке.</div>

      <div class="kv">
        <div class="k">Состояние</div>
        <div><span class="chip ${s.active ? 'g' : 'o'}">${s.active ? 'активен' : 'приостановлен'}</span></div>
        <div class="k">Подтверждение</div>
        <div>${c.verified ? 'родство подтверждено сотрудником' : '<span class="chip o">не подтверждён</span>'}</div>
        ${c.protected ? '<div class="k">Особый порядок</div><div><span class="chip a">защищённая переписка</span></div>' : ''}
      </div>

      ${c.protected ? `<div class="note warn">Защищённый контакт — адвокат или иное лицо,
        оказывающее юридическую помощь. Ограничение возможно только по отдельному
        мотивированному решению, в ОСНОВЕ оно не оформляется.</div>` : `

      <h3 style="margin:20px 0 10px">Доступные каналы</h3>
      <div class="clist">
        ${каналы.map(([k, т]) => `
          <div class="citem"><div>
            <div class="w">${т}</div>
            <div class="s">${s[k] ? 'канал ограничен' : 'канал доступен'}</div>
          </div>
          <button class="btn sm ${s[k] ? 'primary' : ''}" onclick="переключитьКанал('${pid}',${i},'${k}')">
            ${s[k] ? 'Вернуть' : 'Ограничить'}</button></div>`).join('')}
      </div>

      <h3 style="margin:20px 0 10px">Основание</h3>
      ${ОСНОВАНИЯ_ОГРАНИЧЕНИЯ.map((о, n) => `
        <label class="opt ${n === 0 ? 'on' : ''}" onclick="выбратьОснование(this, ${n})">
          <b>${esc(о)}</b></label>`).join('')}

      <h3 style="margin:20px 0 10px">Срок</h3>
      <div class="bar"><div class="seg">
        ${СРОКИ_ОГРАНИЧЕНИЯ.map(([v, т]) => `
          <button class="${v === '30' ? 'on' : ''}" onclick="выбратьСрок(this,'${v}')">${т}</button>`).join('')}
      </div></div>`}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      ${c.protected ? '' : `
        <button class="btn ${s.active ? 'danger' : 'primary'}" onclick="переключитьКонтакт('${pid}',${i})">
          ${s.active ? 'Приостановить контакт' : 'Активировать контакт'}</button>
        <button class="btn primary" onclick="сохранитьОграничение('${pid}',${i})">Сохранить</button>`}
    </div>`);
}

function выбратьОснование(el, n){
  S.черновикКонтакта.основание = ОСНОВАНИЯ_ОГРАНИЧЕНИЯ[n];
  [...el.parentNode.querySelectorAll('.opt')].forEach(x => x.classList.remove('on'));
  el.classList.add('on');
}
function выбратьСрок(el, v){
  S.черновикКонтакта.срок = v;
  [...el.parentNode.querySelectorAll('button')].forEach(x => x.classList.remove('on'));
  el.classList.add('on');
}

function переключитьКанал(pid, i, k){
  const p = ROL.persons.find(x => x.id === pid); if (!p) return;
  if (p.contacts[i].protected) { toast('Защищённый контакт: ограничение в ОСНОВЕ не оформляется'); return; }
  const s = состояниеКонтакта(pid, i);
  s[k] = !s[k];
  открытьУправлениеКонтактом(pid, i);
}

function переключитьКонтакт(pid, i){
  const s = состояниеКонтакта(pid, i);
  s.active = !s.active;
  открытьУправлениеКонтактом(pid, i);
}

function сохранитьОграничение(pid, i){
  const p = ROL.persons.find(x => x.id === pid);
  const c = p.contacts[i];
  const s = состояниеКонтакта(pid, i);
  const ч = S.черновикКонтакта || { основание: ОСНОВАНИЯ_ОГРАНИЧЕНИЯ[0], срок: '30' };
  s.reason = ч.основание;
  s.until = ч.срок === '0' ? 'до отдельного решения' : 'через ' + ч.срок + ' суток';
  s.by = профиль().name;
  s.at = nowStamp();
  closeModal();
  открытьДосье(pid);
  toast('Записано: ' + c.name + ' · ' + ч.основание.toLowerCase() + ' · ' + s.until);
}

/* ============ 2. РЕЖИМ АВТОМАТИЧЕСКОГО КОНТРОЛЯ ============ */

const РЕЖИМЫ_АВТОМАТИКИ = {
  high: ['Высокий', 'Система глубже разбирает сигналы и сама предлагает превентивные действия. Сигналов больше, ложных — тоже больше.'],
  mid:  ['Средний', 'Равновесие между глубиной разбора и числом сигналов. Стартовое значение.'],
  low:  ['Низкий', 'Только то, что выходит за очевидные рамки. Меньше шума и меньше находок.'],
};

/* Обязательный контур — правила, прямо следующие из нормативных
   требований. Локальный режим их не отменяет. */
const ОБЯЗАТЕЛЬНЫЙ_КОНТУР = [
  'Признаки подготовки противоправного действия',
  'Угроза жизни и здоровью',
  'Сведения о порядке охраны и надзора',
  'Участие в разговоре лица, не заявленного в перечне',
];

function открытьРежимАвтоматики(){
  modal(`
    <div class="mh"><div><h3>Режим автоматического контроля</h3>
      <div class="top-sub">Насколько глубоко система разбирает сигналы по учреждению</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note warn" style="margin-top:0"><b>Обязательный контур отключить нельзя.</b>
        Правила, прямо следующие из нормативных требований, действуют при любом режиме:
        <ul class="plain warn-list" style="margin-top:10px">
          ${ОБЯЗАТЕЛЬНЫЙ_КОНТУР.map(x => `<li>${esc(x)}</li>`).join('')}
        </ul>
      </div>
      ${Object.keys(РЕЖИМЫ_АВТОМАТИКИ).map(k => `
        <label class="opt ${S.automation === k ? 'on' : ''}" onclick="назначитьАвтоматику('${k}')">
          <b>${esc(РЕЖИМЫ_АВТОМАТИКИ[k][0])}</b>
          <span>${esc(РЕЖИМЫ_АВТОМАТИКИ[k][1])}</span></label>`).join('')}
      <div class="note" style="margin-bottom:0">Режим влияет на то, сколько событий попадёт
        в вашу ленту. Ни один режим не ограничивает услуги сам по себе — ограничение
        всегда остаётся отдельным решением человека.</div>
    </div>
    <div class="mf"><button class="btn primary" onclick="closeModal()">Закрыть</button></div>`);
}

function назначитьАвтоматику(k){
  S.automation = k;
  closeModal(); render();
  toast('Режим автоматического контроля: ' + РЕЖИМЫ_АВТОМАТИКИ[k][0]);
}

/* ============ 3. ГРАФ СВЯЗЕЙ ============
   По умолчанию видны только связи, поднятые системой для проверки.
   Кнопка «Все связи» добавляет обычные контакты — чтобы не потерять
   контекст и не принять норму за аномалию. */

function открытьГраф(pid, режим){
  const p = ROL.persons.find(x => x.id === pid); if (!p) return;
  S.графРежим = режим || S.графРежим || 'risk';
  const всеСвязи = S.графРежим === 'all';

  const опасные = связиЧеловека(p);
  const опасныеНомера = new Set(опасные.map(x => x.контакт.phone));

  const узлы = p.contacts
    .map((c, i) => ({ c, i, риск: опасныеНомера.has(c.phone) }))
    .filter(x => всеСвязи || x.риск);

  const W = 760, H = 400, cx = W / 2, cy = H / 2;
  const R = Math.min(150, 60 + узлы.length * 8);

  const точки = узлы.map((у, n) => {
    const угол = (Math.PI * 2 * n) / Math.max(1, узлы.length) - Math.PI / 2;
    return { ...у, x: cx + Math.cos(угол) * R, y: cy + Math.sin(угол) * R * 0.78 };
  });

  const рёбра = точки.map(т => `
    <line x1="${cx}" y1="${cy}" x2="${т.x.toFixed(0)}" y2="${т.y.toFixed(0)}"
      stroke="${т.риск ? 'var(--danger)' : 'var(--border)'}"
      stroke-width="${т.риск ? 2.2 : 1.2}" ${т.риск ? '' : 'stroke-dasharray="4 4"'} />`).join('');

  const кружки = точки.map(т => {
    const цвет = т.риск ? 'var(--danger)' : (т.c.verified ? 'var(--success)' : 'var(--warning)');
    const подпись = т.c.name.split(' ')[0];
    const снизу = т.y > cy;
    return `
      <g>
        <circle cx="${т.x.toFixed(0)}" cy="${т.y.toFixed(0)}" r="22" fill="#fff" stroke="${цвет}" stroke-width="2.4"/>
        <text x="${т.x.toFixed(0)}" y="${(т.y + 5).toFixed(0)}" text-anchor="middle"
          font-size="15" fill="${цвет}">${т.c.verified ? '✓' : '?'}</text>
        <text x="${т.x.toFixed(0)}" y="${(снизу ? т.y + 42 : т.y - 30).toFixed(0)}" text-anchor="middle"
          font-size="12" fill="var(--muted)">${esc(подпись)}</text>
      </g>`;
  }).join('');

  modal(`
    <div class="mh"><div><h3>Связи · ${esc(p.name)}</h3>
      <div class="top-sub">${esc(p.unit)} · контактов в перечне: ${p.contacts.length}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="bar">
        <div class="seg">
          <button class="${!всеСвязи ? 'on' : ''}" onclick="открытьГраф('${pid}','risk')">Связи для проверки</button>
          <button class="${всеСвязи ? 'on' : ''}" onclick="открытьГраф('${pid}','all')">Все связи</button>
        </div>
        <span class="chip">${точки.length} из ${p.contacts.length}</span>
      </div>

      <div class="note" style="margin-top:0">${всеСвязи
        ? 'Показаны все контакты перечня. Обычные связи — серым пунктиром: они нужны, чтобы не принять норму за аномалию.'
        : 'Показаны только связи, которые система подняла для проверки: один и тот же номер встречается у нескольких человек.'}</div>

      ${точки.length ? `
        <div class="граф">
          <svg viewBox="0 0 ${W} ${H}" width="100%">
            ${рёбра}
            <circle cx="${cx}" cy="${cy}" r="34" fill="var(--lilac)" stroke="var(--primary)" stroke-width="2.6"/>
            <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="15" font-weight="700"
              fill="var(--primary)">${esc(p.name.split(' ').map(w => w[0]).join('').slice(0, 2))}</text>
            <text x="${cx}" y="${cy + 58}" text-anchor="middle" font-size="12.5"
              fill="var(--muted)">${esc(p.name.split(' ')[0])}</text>
            ${кружки}
          </svg>
        </div>
        <div class="marks" style="margin-top:12px">
          <span class="chip r">поднято системой</span>
          <span class="chip g">✓ подтверждён</span>
          <span class="chip o">? не подтверждён</span>
        </div>` : `
        <div class="empty"><div class="big">${ICON.check}</div><b>Связей для проверки нет</b>
          <div>Ни один номер из перечня не встречается у других людей.</div></div>`}

      ${опасные.length ? `
        <h3 style="margin:20px 0 10px">Общие контакты · ${опасные.length}</h3>
        <div class="clist">${опасные.map(x => `
          <div class="citem"><div>
            <div class="w">${esc(x.контакт.name)} · ${esc(x.контакт.phone)}</div>
            <div class="s">заявлен как «${esc(x.контакт.role)}» · встречается ещё у ${x.люди.length}</div>
            <div class="marks" style="margin-top:8px">${x.люди.map(o =>
              `<button class="chip ${RISK_LETTER[o.risk]}" onclick="closeModal(); открытьДосье('${o.id}')">${esc(o.name)}</button>`).join('')}</div>
          </div></div>`).join('')}</div>` : ''}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal(); открытьДосье('${pid}')">К досье</button>
      <button class="btn primary" onclick="closeModal()">Закрыть</button>
    </div>`);
}

/* ============ 4. СВОЯ ГРУППА НАБЛЮДЕНИЯ ============ */

const РЕЖИМЫ_ГРУППЫ = {
  signal: ['Только сигналы', 'Система поднимает события по составу группы. Разговоры не слушаются.'],
  listen: ['Прослушивание переговоров', 'Разговоры участников попадают в раздел «Сейчас говорят». Требует отдельного основания и фиксируется в журнале.'],
  strict: ['Усиленный анализ', 'Более низкие пороги срабатывания для участников группы. Ограничений сам по себе не вводит.'],
};

function открытьСозданиеГруппы(предвыбран){
  S.черновикГруппы = { name: 'Новая группа наблюдения', mode: 'signal', люди: предвыбран ? [предвыбран] : [] };
  S.поискГруппы = '';
  показатьСозданиеГруппы();
}

/* Поиск человека для группы: по фамилии и имени, отряду или камере,
   статье и дате рождения. Людей в учреждении тысячи, поэтому без поиска
   ручная сборка не работает вовсе. */
function найтиДляГруппы(){
  const q = (S.поискГруппы || '').trim().toLowerCase();
  if (q.length < 2) return [];
  return ROL.persons.filter(p =>
    p.name.toLowerCase().includes(q)
    || String(местоЧеловека(p)).toLowerCase().includes(q)
    || String(p.article).toLowerCase().includes(q)
    || String(p.dob).includes(q)
  );
}

function показатьСозданиеГруппы(){
  const ч = S.черновикГруппы;
  const найдены = найтиДляГруппы();
  const q = (S.поискГруппы || '').trim();

  modal(`
    <div class="mh"><div><h3>Своя группа наблюдения</h3>
      <div class="top-sub">Личная подборка оперативного сотрудника</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <label class="fld">Название
        <input id="grName" value="${esc(ч.name)}" oninput="S.черновикГруппы.name=this.value"></label>

      <h3 style="margin:18px 0 10px">Кого добавить</h3>
      <input id="grSearch" class="search" style="max-width:none; width:100%"
        placeholder="Фамилия, ${S.facility === 'сизо' ? 'камера' : 'отряд'}, статья или дата рождения"
        value="${esc(S.поискГруппы || '')}"
        oninput="вводПоиска('grSearch', v => { S.поискГруппы = v; показатьСозданиеГруппы(); })">

      ${q.length >= 2 ? `
        <div class="top-sub" style="margin:8px 0">Найдено: ${найдены.length}${найдены.length > 15 ? ' — показаны первые 15' : ''}</div>
        ${найдены.length ? `<div class="находки">${найдены.slice(0, 15).map(p => {
          const уже = ч.люди.includes(p.id);
          return `<button class="находка" onclick="${уже ? `убратьИзЧерновика('${p.id}')` : `добавитьВЧерновик('${p.id}')`}">
            <b>${уже ? '✓ ' : ''}${esc(p.name)}</b>
            <span>${esc(местоЧеловека(p))} · ст. ${esc(p.article)} · ${esc(p.dob)} · ${esc(p.riskText)}</span></button>`;
        }).join('')}</div>`
        : '<div class="top-sub">Никого не нашлось. Попробуйте другой запрос.</div>'}`
        : '<div class="top-sub" style="margin-top:8px">Введите хотя бы две буквы.</div>'}

      <h3 style="margin:18px 0 10px">Режим</h3>
      ${Object.keys(РЕЖИМЫ_ГРУППЫ).map(k => `
        <label class="opt ${ч.mode === k ? 'on' : ''}" onclick="выбратьРежимГруппы('${k}')">
          <b>${esc(РЕЖИМЫ_ГРУППЫ[k][0])}</b><span>${esc(РЕЖИМЫ_ГРУППЫ[k][1])}</span></label>`).join('')}

      ${ч.mode === 'listen' ? `<div class="note warn">Прослушивание переговоров включается
        по отдельному основанию. Каждое подключение к разговору фиксируется в журнале
        с указанием сотрудника и времени.</div>` : ''}

      <h3 style="margin:18px 0 10px">Состав · ${ч.люди.length}</h3>
      ${ч.люди.length ? `<div class="marks">${ч.люди.map(id => {
        const o = ROL.persons.find(x => x.id === id);
        return o ? `<span class="chip ${RISK_LETTER[o.risk]}">${esc(o.name)}
          <button class="link" onclick="убратьИзЧерновика('${id}')">убрать</button></span>` : '';
      }).join('')}</div>` : '<div class="top-sub">Никто не выбран. Найдите людей поиском выше или добавьте из досье.</div>'}

      <div class="note" style="margin-top:16px; margin-bottom:0">Если людей много и их объединяет
        общий признак — отряд, статья, категория учёта, — быстрее собрать группу по признаку:
        состав подберётся сам.</div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="открытьГруппуПоПризнаку()">По признаку</button>
      <button class="btn primary" onclick="создатьГруппу()" ${ч.люди.length ? '' : 'disabled'}>
        Создать группу${ч.люди.length ? ' · ' + ч.люди.length : ''}</button>
    </div>`);
}

function добавитьВЧерновик(id){
  if (!S.черновикГруппы) return;
  if (!S.черновикГруппы.люди.includes(id)) S.черновикГруппы.люди.push(id);
  показатьСозданиеГруппы();
}

function выбратьРежимГруппы(k){ S.черновикГруппы.mode = k; показатьСозданиеГруппы(); }
function убратьИзЧерновика(id){
  S.черновикГруппы.люди = S.черновикГруппы.люди.filter(x => x !== id);
  показатьСозданиеГруппы();
}

function вСвоюГруппу(pid){
  if (!S.черновикГруппы) S.черновикГруппы = { name: 'Новая группа наблюдения', mode: 'signal', люди: [] };
  if (!S.черновикГруппы.люди.includes(pid)) S.черновикГруппы.люди.push(pid);
  closeModal();
  показатьСозданиеГруппы();
}

function создатьГруппу(){
  const ч = S.черновикГруппы;
  if (!ч.люди.length) return;
  const id = 'm' + (LIVE.groups.filter(g => g.type === 'manual').length + 1) + '-' + Date.now().toString().slice(-4);
  LIVE.groups.push({
    id, name: ч.name.trim() || 'Группа без названия', type: 'manual',
    count: ч.люди.length, color: 'orange',
    criterion: 'личная подборка: ' + профиль().name,
    policy: РЕЖИМЫ_ГРУППЫ[ч.mode][1],
    mode: ч.mode,
  });
  ОПЕР.составы[id] = [...ч.люди];
  S.черновикГруппы = null;
  closeModal(); go('groups');
  toast('Группа создана: ' + LIVE.groups[LIVE.groups.length - 1].name);
}

/* ============ 5. ВРЕМЕННАЯ ШКАЛА ============ */

function открытьШкалу(pid){
  const p = ROL.persons.find(x => x.id === pid); if (!p) return;
  const ист = архивЧеловека(p.id);
  const порядок = ист.slice().sort((a, b) => b[1] - a[1]);

  /* Вехи: прибытие, появление контактов, первое и последнее отправление. */
  const события = [];
  события.push({ дата: p.since, текст: '<b>Прибытие в учреждение.</b> Личность установлена, заведено дело.' });
  p.contacts.slice(0, 4).forEach((c, i) => {
    события.push({
      дата: hДата(Math.max(1, 88 - i * 12)),
      текст: 'Добавлен контакт «' + esc(c.name) + '», заявлен как «' + esc(c.role) + '». '
        + (c.verified ? 'Подтверждён сотрудником.' : '<b>Родство не подтверждено.</b>'),
    });
  });
  if (порядок.length) {
    события.push({ дата: hДата(порядок[0][1]), текст: 'Первое отправление в архиве.' });
    const недоп = ист.filter(z => z[8] === 2).length;
    if (недоп) события.push({
      дата: hДата(ист.filter(z => z[8] === 2).map(z => z[1]).sort((a, b) => a - b)[0]),
      текст: '<b>Недопуск.</b> Всего за три месяца: ' + недоп + '.',
    });

/* ============ 6. НАБЛЮДАТЬ 7 ДНЕЙ ============
   Быстрое действие прямо на событии: не открывая карточку, поставить
   человека под наблюдение на неделю. */

function наблюдать7(pid, имя){
  let g = LIVE.groups.find(x => x.id === 'watch7');
  if (!g) {
    g = { id: 'watch7', name: 'Наблюдение 7 суток', type: 'manual', count: 0, color: 'orange',
      criterion: 'поставлены под наблюдение вручную из ленты событий',
      policy: 'повышенное внимание к сигналам в течение недели, ограничений не вводится', mode: 'signal' };
    LIVE.groups.push(g);
    ОПЕР.составы.watch7 = [];
  }
  if (!ОПЕР.составы.watch7.includes(pid)) {
    ОПЕР.составы.watch7.push(pid);
    g.count = ОПЕР.составы.watch7.length;
  }
  render();
  toast((имя || 'Человек') + ' под наблюдением 7 суток. Группа «Наблюдение 7 суток».');
}

function подтвердитьДелегирование(тема){
  const s = LIVE.staff.find(x => x.id === S.черновикДелегата);

/* ====================================================================
   РАБОЧЕЕ МЕСТО ОПЕРАТИВНОГО СОТРУДНИКА

   Построено вокруг его работы, а не вокруг наших сервисов.
   Задачи заданы статьёй 84 УИК РФ:
     1) личная безопасность осуждённых, персонала и иных лиц;
     2) выявление, предупреждение и раскрытие преступлений и нарушений;
     3) розыск совершивших побег и уклоняющихся;
     4) содействие в раскрытии преступлений, совершённых до прибытия.

   Ежедневная основа второй задачи — профилактический учёт: комиссия,
   трёхмесячный пересмотр, закреплённый сотрудник, индивидуальные беседы.
   Переписка и разговоры — только один из источников сведений, поэтому
   раздел «От цензора» стоит наравне с рапортами дежурной смены и
   сообщениями медчасти, а не выше них.
   ==================================================================== */

const ПРОФУЧЁТ = (ROL.prevention || []).map(z => ({ ...z }));
const КАТЕГОРИИ = ROL.preventionCats || [];
const МЕРОПРИЯТИЯ = ROL.measures || [];
const ОСНОВАНИЯ_СНЯТИЯ = ROL.removal || [];
const ПРОИСШЕСТВИЯ = (ROL.incidents || []).map(z => ({ ...z, status: 'open' }));
const ЗАПРОСЫ = (ROL.requests || []).map(z => ({ ...z, status: 'open' }));

const просроченные = () => ПРОФУЧЁТ.filter(z => !z.removed && z.reviewIn < 0);
const скороПересмотр = () => ПРОФУЧЁТ.filter(z => !z.removed && z.reviewIn >= 0 && z.reviewIn <= 14);
const безБеседы = () => ПРОФУЧЁТ.filter(z => !z.removed && z.talkDaysAgo > 30);
const наУчёте = () => ПРОФУЧЁТ.filter(z => !z.removed);
const мои = () => наУчёте().filter(z => z.owner === 'Петров А.С.');
const открытыеПроисшествия = () => ПРОИСШЕСТВИЯ.filter(x => x.status === 'open');
const открытыеЗапросы = () => ЗАПРОСЫ.filter(x => x.status === 'open');

/* Сколько дел требует от оперативника действия сегодня. */
function требуетДействия(){
  return просроченные().length + открытыеПроисшествия().filter(x => x.urgency !== 'green').length
    + переданные().length + открытыеЗапросы().filter(x => x.due <= '05.10.2026').length;
}

/* ====================================================================
   ТИП УЧРЕЖДЕНИЯ: КОЛОНИЯ И СЛЕДСТВЕННЫЙ ИЗОЛЯТОР

   Один и тот же продукт работает в ИК и в СИЗО, но это не замена слов.
   В СИЗО содержатся подозреваемые и обвиняемые — вина не установлена,
   а уголовное дело находится в производстве следствия или суда. Отсюда
   три отличия, которые меняют саму работу:

     1. Недопущенное письмо не изымается «в личное дело», а направляется
        лицу или органу, в производстве которых дело, либо в суд.
     2. Телефонный разговор возможен только по разрешению следствия
        или суда. Нет разрешения — разговор невозможен вообще.
     3. Лица по одному делу содержатся раздельно, поэтому общий адресат
        у соучастников — сигнал первой величины для оперативника.

   Переключатель стоит в шапке рядом с названием учреждения.
   ==================================================================== */

const ТИПЫ = ROL.facilityTypes || {};
const СИЗО = ROL.sizo || { записи: {}, дела: [] };

/* Текущее учреждение и его словарь. */
function У(){ return ТИПЫ[S.facility] || ТИПЫ.ик || {}; }
/* Короткий доступ к термину: Т('человек') → «осуждённый» или «обвиняемый». */
function Т(ключ){ return У()[ключ] || ''; }

/* Сведения по человеку в режиме СИЗО: камера, дело, соучастники, разрешение. */
function сизоДанные(pid){ return S.facility === 'сизо' ? (СИЗО.записи[pid] || null) : null; }

/* Где человек содержится: отряд или камера. */
function местоЧеловека(p){
  const с = сизоДанные(p.id);
  return с ? с.cell : p.unit;
}

function сменитьУчреждение(t){
  S.facility = t;
  S.shown = 30; S.openId = null; S.conveyor = null;
  render();
  toast('Учреждение: ' + У().name + ' · ' + У().контингент);
}

/* ---------- соучастники ----------
   Связь между лицами по одному делу — то, ради чего в СИЗО вообще
   смотрят переписку оперативно. Ищем и прямую связь, и через общего
   адресата: соучастники редко пишут друг другу напрямую. */

function соучастники(pid){
  const с = сизоДанные(pid);
  if (!с || !с.coDefendants.length) return [];
  return с.coDefendants.map(id => ROL.persons.find(p => p.id === id)).filter(Boolean);
}

/* Общий адресат у соучастников: номер, который есть и у него, и у того,
   с кем он проходит по делу. */
function связьЧерезПосредника(pid){
  const со = соучастники(pid);
  if (!со.length) return [];
  const p = ROL.persons.find(x => x.id === pid);
  if (!p) return [];
  const найдено = [];
  p.contacts.forEach(c => {
    const общие = со.filter(o => o.contacts.some(x => x.phone === c.phone));
    if (общие.length) найдено.push({ контакт: c, соучастники: общие });
  });
  return найдено;
}

/* Блок для досье и для карточки материала. */
function блокСоучастников(pid){
  if (S.facility !== 'сизо') return '';
  const с = сизоДанные(pid);
  if (!с) return '';
  const со = соучастники(pid);
  const через = связьЧерезПосредника(pid);

  return `
    <h3 style="margin:22px 0 10px; font-size:16px">Уголовное дело</h3>
    <div class="kv">

      <div class="k">В производстве</div><div>${esc(с.body)}</div>
      <div class="k">Процессуальный статус</div><div>${esc(с.status)}</div>
      <div class="k">Разрешение на разговоры</div>
      <div>${с.permit
        ? `<span class="chip g">есть</span> ${esc(с.permit.no)} от ${esc(с.permit.by)}, до ${esc(с.permit.until)}`
        : '<span class="chip r">нет</span> телефонные разговоры не предоставляются'}</div>
    </div>

    ${со.length ? `
      <div class="note warn" style="margin-top:14px"><b>По делу проходят ещё ${со.length}
        ${plural(со.length, 'человек', 'человека', 'человек')}.</b>
        Лица по одному делу содержатся раздельно. Любая связь между ними,
        в том числе через общего адресата, требует проверки.</div>
      <div class="marks" style="margin-top:10px">
        ${со.map(o => `<button class="chip ${RISK_LETTER[o.risk]}"
          onclick="открытьДосье('${o.id}')">${esc(o.name)} · ${esc(местоЧеловека(o))}</button>`).join('')}
      </div>` : ''}

    ${через.length ? `
      <div class="note warn" style="margin-top:14px"><b>Общий адресат с соучастником — ${через.length}.</b>
        Это основной способ связи между теми, кого развели по камерам.</div>
      <div class="clist" style="margin-top:12px">
        ${через.map(x => `
          <div class="citem"><div>
            <div class="w">${esc(x.контакт.name)} · ${esc(x.контакт.phone)}</div>
            <div class="s">этот же номер у: ${x.соучастники.map(o => esc(o.name)).join(', ')}</div>
          </div></div>`).join('')}
      </div>` : ''}`;
}

/* Короткая метка для ленты цензуры и очереди оперативника. */
function меткаСоучастника(pid){
  if (S.facility !== 'сизо') return '';
  const через = связьЧерезПосредника(pid);
  if (!через.length) return '';
  return '<span class="chip r" title="Номер адресата совпадает с номером у лица, проходящего по тому же делу">связь с соучастником</span>';

/* Метка разрешения: в СИЗО без него разговоров нет. */
function меткаРазрешения(pid){

/* ====================================================================
   ГРУППА ПО ПРИЗНАКУ

   Собирать группу, отмечая людей по одному, годится для двух-трёх человек.
   В работе признак обычно другой: «все из этой камеры», «все по этой
   статье», «все, у кого контакты не подтверждены», «все соучастники».
   Поэтому группа собирается фильтром, а состав показывается сразу —
   до создания видно, сколько человек попадёт и кто именно.
   ==================================================================== */

const ПРИЗНАКИ_ПО_УМОЛЧАНИЮ = {
  risk: '', place: '', article: '', lang: '',
  unverified: false, mass: false, prevention: '',
  codef: false, nopermit: false,
};

function подходит(p, ф){
  if (ф.risk && p.risk !== ф.risk) return false;
  if (ф.place && местоЧеловека(p) !== ф.place) return false;
  if (ф.article && p.article !== ф.article) return false;
  if (ф.lang && p.lang !== ф.lang) return false;
  if (ф.unverified && !p.contacts.some(c => !c.verified && !c.protected)) return false;
  if (ф.mass && !p.contacts.some(c => (ОПЕР.индексТелефонов[c.phone] || []).length > 1)) return false;
  if (ф.prevention && !ПРОФУЧЁТ.some(z => !z.removed && z.pid === p.id && z.cat === ф.prevention)) return false;
  if (ф.codef && !соучастники(p.id).length) return false;
  if (ф.nopermit) { const с = сизоДанные(p.id); if (!с || с.permit) return false; }
  return true;
}

function отобранные(){
  const ф = S.признаки || ПРИЗНАКИ_ПО_УМОЛЧАНИЮ;
  const пусто = !ф.risk && !ф.place && !ф.article && !ф.lang && !ф.unverified
    && !ф.mass && !ф.prevention && !ф.codef && !ф.nopermit;
  if (пусто) return [];
  return ROL.persons.filter(p => подходит(p, ф));
}

/* Словесное описание набора признаков — оно же станет критерием группы. */
function описаниеПризнаков(){
  const ф = S.признаки || {};
  const части = [];
  if (ф.risk) части.push('уровень внимания: ' + RISK_ONE[ф.risk]);
  if (ф.place) части.push((S.facility === 'сизо' ? 'камера: ' : 'отряд: ') + ф.place);
  if (ф.article) части.push('статья ' + ф.article);
  if (ф.lang) части.push('язык переписки: ' + (LANG_LABEL[ф.lang] || ф.lang));
  if (ф.unverified) части.push('есть неподтверждённые контакты');
  if (ф.mass) части.push('общий контакт с другими людьми');
  if (ф.prevention) части.push('на профучёте: ' + (КАТЕГОРИИ.find(k => k.id === ф.prevention) || {}).name);
  if (ф.codef) части.push('проходит по делу с соучастниками');
  if (ф.nopermit) части.push('без разрешения на телефонные разговоры');
  return части.join('; ') || 'признаки не заданы';
}

function открытьГруппуПоПризнаку(){
  S.признаки = { ...ПРИЗНАКИ_ПО_УМОЛЧАНИЮ };
  S.имяГруппы = '';
  S.режимГруппы = 'signal';
  показатьГруппуПоПризнаку();
}

function показатьГруппуПоПризнаку(){
  const ф = S.признаки;
  const найдены = отобранные();
  const места = [...new Set(ROL.persons.map(местоЧеловека))].sort();
  const статьи = [...new Set(ROL.persons.map(p => p.article))].sort();

  const выбор = (поле, подпись, значения) => `
    <label class="fld">${подпись}
      <select onchange="S.признаки.${поле}=this.value; показатьГруппуПоПризнаку()">
        <option value="">не важно</option>
        ${значения.map(([v, t]) => `<option value="${esc(v)}" ${ф[поле] === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select></label>`;

  const галочка = (поле, подпись, пояснение) => `
    <label class="переключ">
      <input type="checkbox" ${ф[поле] ? 'checked' : ''}
             onchange="S.признаки.${поле}=this.checked; показатьГруппуПоПризнаку()">
      <span>${подпись}${пояснение ? ` <span class="top-sub">— ${пояснение}</span>` : ''}</span>
    </label>`;

function создатьГруппуПоПризнаку(){
  const найдены = отобранные();
  if (!найдены.length) return;
  const id = 'f' + Date.now().toString().slice(-6);
  const имя = (S.имяГруппы || '').trim() || описаниеПризнаков().slice(0, 60);
  LIVE.groups.push({
    id, name: имя, type: 'manual',
    count: найдены.length,
    color: S.признаки.risk === 'red' ? 'red' : 'orange',
    criterion: 'по признаку: ' + описаниеПризнаков(),
    policy: РЕЖИМЫ_ГРУППЫ[S.режимГруппы][1],
    mode: S.режимГруппы,
    byFilter: true,
  });
  ОПЕР.составы[id] = найдены.map(p => p.id);
  closeModal(); go('groups');
  toast('Группа создана: ' + имя + ' · ' + найдены.length + ' ' + plural(найдены.length, 'человек', 'человека', 'человек'));
}

/* ====================================================================
   ЛЮДИ И СВЯЗИ: сортировка, фильтры, признак опасных связей

   Список из 2400 человек без порядка бесполезен. По умолчанию наверх
   поднимаются те, у кого есть признак опасных связей: общий контакт
   с другими людьми, а в изоляторе — ещё и с соучастниками по делу.
   Именно с них начинают, а не с буквы «А».
   ==================================================================== */

/* Есть ли у человека признак опасных связей и какой именно. */
function опасныеСвязи(p){
  const общие = связиЧеловека(p);
  const соуч = S.facility === 'сизо' ? связьЧерезПосредника(p.id) : [];
  const неподтв = p.contacts.filter(c => !c.verified && !c.protected).length;
  return {
    общие: общие.length,
    соучастники: соуч.length,
    неподтверждённые: неподтв,
    есть: общие.length > 0 || соуч.length > 0,
    вес: соуч.length * 100 + общие.length * 10 + неподтв,
  };
}

const СОРТИРОВКИ = {
  default: ['Сначала опасные связи', (a, b) => опасныеСвязи(b).вес - опасныеСвязи(a).вес
    || РИСК_ВЕС[b.risk] - РИСК_ВЕС[a.risk] || a.name.localeCompare(b.name, 'ru')],
  alpha:   ['По алфавиту', (a, b) => a.name.localeCompare(b.name, 'ru')],
  risk:    ['По уровню внимания', (a, b) => РИСК_ВЕС[b.risk] - РИСК_ВЕС[a.risk]
    || a.name.localeCompare(b.name, 'ru')],
  place:   ['По месту', (a, b) => String(местоЧеловека(a)).localeCompare(String(местоЧеловека(b)), 'ru')
    || a.name.localeCompare(b.name, 'ru')],
};
const РИСК_ВЕС = { red: 3, orange: 2, green: 1 };

const ФИЛЬТРЫ_ЛЮДЕЙ = {
  all:      ['Все', () => true],
  links:    ['С опасными связями', p => опасныеСвязи(p).есть],
  red:      ['Повышенное внимание', p => p.risk === 'red'],
  unverif:  ['Неподтверждённые контакты', p => p.contacts.some(c => !c.verified && !c.protected)],
  prevent:  ['На профучёте', p => ПРОФУЧЁТ.some(z => !z.removed && z.pid === p.id)],
  nolink:   ['Без перечня контактов', p => !p.contacts.length],
};

/* ---------- история сигналов человека за три месяца ---------- */

function сигналыЧеловека(pid){
  const записи = архивЧеловека(pid);
  const красные = записи.filter(z => z[7] === 2);
  const оранжевые = записи.filter(z => z[7] === 1);
  const недопуски = записи.filter(z => z[8] === 2);
  const вымарано = записи.filter(z => z[8] === 1);
  const поКаналам = { письмо: 0, голос: 0, видео: 0 };
  красные.concat(оранжевые).forEach(z => { поКаналам[H_КАНАЛ[z[5]]]++; });
  return { всего: записи.length, красные, оранжевые, недопуски, вымарано, поКаналам };
}

/* Блок истории сигналов для досье: не цифра, а перечень с датами. */
function блокСигналов(pid){
  const с = сигналыЧеловека(pid);

      <div class="stat"><div class="k">Красных сигналов</div><div class="v tnum">${с.красные.length}</div>
        <div class="d">${с.всего ? Math.round(с.красные.length / с.всего * 100) : 0}% переписки</div></div>
      <div class="stat"><div class="k">Оранжевых</div><div class="v tnum">${с.оранжевые.length}</div>

      <div class="stat"><div class="k">Не допущено</div><div class="v tnum">${с.недопуски.length}</div>
        <div class="d">вымарано ещё ${с.вымарано.length}</div></div>
    </div>

    ${с.красные.length ? `
      <div class="note warn" style="margin-top:0"><b>Красные сигналы: ${с.красные.length}.</b>
        В письмах ${с.поКаналам.письмо}, в голосовых ${с.поКаналам.голос}, в видео ${с.поКаналам.видео}

/* ---------- сводка связей одной строкой ---------- */

function блокОпасныхСвязей(p){
  const о = опасныеСвязи(p);
  if (!о.есть && !о.неподтверждённые) return '';
  const части = [];
  if (о.соучастники) части.push('общий адресат с соучастником — ' + о.соучастники);
  if (о.общие) части.push('общий контакт с другими людьми — ' + о.общие);
  if (о.неподтверждённые) части.push('не подтверждено контактов — ' + о.неподтверждённые);
  return `<div class="note ${о.есть ? 'warn' : ''}" style="margin-top:14px">
    <b>Признаки для проверки:</b> ${esc(части.join('; '))}.</div>`;
}

/* ====================================================================
   ОБНОВЛЕНИЕ БАЗЫ: КАК ЧЕЛОВЕК В НЕЁ ПОПАДАЕТ

   Чтобы звонить или отправлять голосовые и видеосообщения, человек пишет
   заявление. Чаще всего от руки, на бумаге. Бумага остаётся у учреждения
   в любом случае.

   Три пути, и все три сходятся в одном месте — во «Входящих» у
   оперативного сотрудника:

     1. БУМАГА. Заявление принесли воспитателю или оперу. Он либо вбивает
        данные руками, либо сканирует заявление и запускает распознавание:
        система заполняет карточку, её остаётся проверить и сохранить.

     2. ТЕРМИНАЛ. Человек внёс данные сам. Они ждут подтверждения личности:
        без него заявление силы не имеет.

     3. ЦЕНЗОР. Переписка ничем не ограничена, и письмо приходит на того,
        кого в базе нет. Цензор сверяет ФИО по картотеке учреждения:
        числится — вносит сама, не числится — отклоняет письмо с отметкой
        «адресат не числится». Внесённый ею человек попадает сюда же,
        на подтверждение личности. Это не срочно и может накапливаться.

   Главное ограничение: пока личность не подтверждена оперативным
   сотрудником, человеку доступна только текстовая переписка. Звонки,
   голосовые и видео — после подтверждения.
   ==================================================================== */

const ЗАЯВЛЕНИЯ = (ROL.applications || []).map(z => ({ ...z }));

function ждутРазбора(){ return ЗАЯВЛЕНИЯ.filter(z => z.status === 'новое' || z.status === 'на подтверждении'); }
function разобранные(){ return ЗАЯВЛЕНИЯ.filter(z => z.status === 'подтверждено' || z.status === 'отклонено'); }

const ИСТОЧНИК_ПОДПИСЬ = {
  бумага:   ['Бумажное заявление', 'принесено воспитателю или оперативному сотруднику'],
  терминал: ['Терминал', 'человек внёс данные сам'],
  цензор:   ['От цензора', 'появился из входящего письма'],
};

/* Можно ли человеку что-то кроме текста. */
function толькоТекст(pid){
  const p = POP.поId[pid];
  return !!p && !p.confirmed;
}

          : `<button class="btn sm" onclick="отклонитьЗаявление('${z.id}')">Отклонить</button>
             <button class="btn sm primary" onclick="подтвердитьЛичность('${z.id}')">Подтвердить личность</button>`}
      </div>
    </div>`;
  };

  const поИсточникам = {};
  ждут.forEach(z => { поИсточникам[z.source] = (поИсточникам[z.source] || 0) + 1; });

  return `
    <div class="note">Три пути, которыми человек попадает в базу: бумажное заявление,
      терминал и внесение цензором из входящего письма. Пока личность не подтверждена,
      человеку доступна <b>только текстовая переписка</b> — звонки, голосовые и видео после подтверждения.</div>

    <div class="stats">
      <div class="stat"><div class="badge-ico" style="background:var(--soft-beige); color:var(--warning)">${ICON.inbox}</div>
        <div class="k">Ждут разбора</div><div class="v tnum">${ждут.length}</div><div class="d">не горит, можно копить</div></div>
      <div class="stat"><div class="badge-ico" style="background:var(--lilac); color:var(--primary)">${ICON.printer}</div>
        <div class="k">С бумаги</div><div class="v tnum">${поИсточникам['бумага'] || 0}</div><div class="d">заявления от руки</div></div>
      <div class="stat"><div class="badge-ico" style="background:var(--soft-mint); color:var(--success)">${ICON.services}</div>
        <div class="k">С терминала</div><div class="v tnum">${поИсточникам['терминал'] || 0}</div><div class="d">внесли сами</div></div>
      <div class="stat"><div class="badge-ico" style="background:var(--soft-pink); color:var(--danger)">${ICON.channel}</div>
        <div class="k">От цензора</div><div class="v tnum">${поИсточникам['цензор'] || 0}</div><div class="d">из входящих писем</div></div>
    </div>

    <h2 class="sect">Ждут разбора · ${ждут.length}</h2>
    ${ждут.length ? `<div class="rows">${ждут.map(строка).join('')}</div>`
      : `<div class="empty"><div class="big">${ICON.check}</div><b>Входящих нет</b>
         <div>Заявления и внесённые цензором люди появятся здесь.</div></div>`}

    <h2 class="sect">Разобрано за три месяца · ${разобранные().length}</h2>
    <div class="журнал">
      <table class="журнал-таб" style="min-width:0">
        <thead><tr><th>№</th><th>Дата</th><th>Человек</th><th>Путь</th><th>Просил</th><th>Итог</th><th>Кто</th></tr></thead>
        <tbody>${разобранные().slice(0, 25).map(z => `
          <tr>
            <td>${esc(z.id)}</td><td class="tnum">${esc(z.at)}</td>
            <td>${esc(z.person)}</td>
            <td>${esc((ИСТОЧНИК_ПОДПИСЬ[z.source] || [z.source])[0])}</td>
            <td>${esc(z.want)}</td>
            <td><span class="chip ${z.status === 'подтверждено' ? 'g' : 'r'}">${esc(z.status)}</span></td>
            <td>${esc(z.by || '')}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
    ${разобранные().length > 25 ? `<div class="top-sub" style="margin-top:8px">показаны последние 25 из ${разобранные().length}</div>` : ''}`;

/* ---------- ручное внесение ---------- */

function внестиВручную(id, распознано){
  const z = ЗАЯВЛЕНИЯ.find(x => x.id === id); if (!z) return;
  const р = !!распознано;
  modal(`
    <div class="mh"><div><h3>${р ? 'Распознанное заявление' : 'Внести данные вручную'}</h3>
      <div class="top-sub">${esc(z.id)} · ${esc((ИСТОЧНИК_ПОДПИСЬ[z.source] || [z.source])[0])} · ${esc(z.at)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      ${р ? `<div class="note ok" style="margin-top:0"><b>Заявление распознано.</b>

        Набирать вручную придётся только то, чего в базе нет.

        <label class="fld">Статья${выборИз('regArt', статьиУчреждения(), z.article)}</label>
      </div>

      <label class="fld">Что просит</label>
      <div class="seg" style="margin-bottom:14px">

      </div>
      <input type="hidden" id="regWant" value="${esc(z.want)}">

      <div class="два">
        <label class="fld">Заявленный контакт<input id="regContact" value="${esc(z.contact)}"></label>
        <label class="fld">Телефон<input id="regPhone" value="${esc(z.phone)}"></label>
      </div>

      ${р ? `<div class="note warn">Распознавание рукописного текста ошибается на фамилиях
        и номерах. Сверьте их со сканом до сохранения.</div>` : ''}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="сохранитьЗаявление('${z.id}')">Сохранить и подтвердить</button>
    </div>`);
}

/* ---------- скан и распознавание ---------- */

function сканЗаявления(id){
  const z = ЗАЯВЛЕНИЯ.find(x => x.id === id); if (!z) return;
  modal(`
    <div class="mh"><div><h3>Скан заявления</h3>
      <div class="top-sub">${esc(z.id)} · ${esc(z.person)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="drop-зона">
        <div class="drop-ико">${ICON.printer}</div>
        <b>Заявление отсканировано</b>
        <span>заявление_${esc(z.id)}.pdf · 1 лист · рукописный текст</span>
      </div>
      <div class="note">Распознавание вытащит из скана ФИО, дату рождения, отряд и заявленные
        контакты и подставит их в карточку. Скан останется приложенным — на него ссылаются
        при проверке, и он подтверждает, что бумага была.</div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="внестиВручную('${z.id}')">Внести руками</button>
      <button class="btn primary" onclick="распознать('${z.id}')">Распознать</button>
    </div>`);
}

function распознать(id){
  toast('Распознавание…');
  setTimeout(() => внестиВручную(id, true), 550);
}

/* ---------- сохранение и подтверждение ---------- */

/* Набор текста — самое медленное место в работе с заявлением. Поэтому всё,
   что можно выбрать, выбирается: отряд и статья — списком, вид просьбы —
   кнопками, а человека из картотеки достаточно найти по трём буквам фамилии.
   Руками остаются только сведения, которых в базе нет: контакт и телефон. */

function местаУчреждения(){
  return [...new Set((POP.люди || []).map(местоЧеловека))].sort();
}

function статьиУчреждения(){
  return [...new Set((POP.люди || []).map(p => p.article))]
    .sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));
}

function видыЗапроса(){
  return [...new Set(ЗАЯВЛЕНИЯ.map(z => z.want))];
}

function выборИз(id, варианты, текущее){
  const есть = варианты.includes(текущее);
  return `<select id="${id}">
    ${есть ? '' : `<option value="${esc(текущее)}" selected>${esc(текущее)} — как в заявлении</option>`}
    ${варианты.map(в => `<option value="${esc(в)}" ${в === текущее ? 'selected' : ''}>${esc(в)}</option>`).join('')}
  </select>`;
}

function регВид(кнопка, значение){
  [...кнопка.parentNode.children].forEach(б => б.classList.remove('on'));
  кнопка.classList.add('on');
  const поле = document.getElementById('regWant');
  if (поле) поле.value = значение;
}

function регНайти(){
  const блок = document.getElementById('regНайдено'); if (!блок) return;
  const поле = document.getElementById('regName');
  const q = ((поле && поле.value) || '').trim().toLowerCase();
  if (q.length < 3) {
    блок.innerHTML = '<span class="muted">Наберите хотя бы три буквы фамилии.</span>';
    return;
  }
  const найдено = (POP.люди || []).filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
  блок.innerHTML = найдено.length
    ? найдено.map(p => `<button class="btn sm" style="margin:0 8px 8px 0" onclick="регВзять('${p.id}')">
        ${esc(p.name)} · ${esc(местоЧеловека(p))} · ${esc(p.dob)}${p.confirmed ? '' : ' · личность не подтверждена'}
      </button>`).join('')
    : '<span class="muted">В картотеке такого нет. Значит, вносим нового человека — заполните поля руками.</span>';
}

function регВзять(pid){
  const p = POP.поId[pid]; if (!p) return;
  const уст = (id, знач) => { const e = document.getElementById(id); if (e) e.value = знач; };
  уст('regName', p.name);
  уст('regDob', p.dob);
  уст('regUnit', местоЧеловека(p));
  уст('regArt', p.article);
  const блок = document.getElementById('regНайдено');
  if (блок) блок.innerHTML = `<span class="chip g">выбран</span> ${esc(p.name)} — поля заполнены из картотеки.`;
}

function сохранитьЗаявление(id){
  const z = ЗАЯВЛЕНИЯ.find(x => x.id === id); if (!z) return;
  const поле = k => { const e = document.getElementById(k); return e ? e.value.trim() : ''; };
  z.person = поле('regName') || z.person;
  z.dob = поле('regDob') || z.dob;
  z.unit = поле('regUnit') || z.unit;
  z.article = поле('regArt') || z.article;
  z.contact = поле('regContact') || z.contact;
  z.phone = поле('regPhone') || z.phone;
  z.want = поле('regWant') || z.want;
  завершитьЗаявление(z, 'подтверждено');
}

function подтвердитьЛичность(id){
  const z = ЗАЯВЛЕНИЯ.find(x => x.id === id); if (!z) return;
  завершитьЗаявление(z, 'подтверждено');
}

function отклонитьЗаявление(id){
  const z = ЗАЯВЛЕНИЯ.find(x => x.id === id); if (!z) return;
  завершитьЗаявление(z, 'отклонено');
}

function завершитьЗаявление(z, статус){
  z.status = статус;
  z.by = профиль().name.split(' ')[0] + ' ' + профиль().name.split(' ').slice(1).map(w => w[0] + '.').join('');
  const p = POP.поId[z.pid];
  if (p && статус === 'подтверждено') p.confirmed = true;
  closeModal(); render();
  toast(статус === 'подтверждено'
    ? z.person + ' — личность подтверждена. Доступны звонки и сообщения.'
    : z.person + ' — заявление отклонено. Остаётся только текстовая переписка.');
}

/* ---------- сторона цензора ---------- */

/* Письмо пришло на человека, которого нет в базе или он не подтверждён. */
function адресатНеПодтверждён(x){
  return !!x.toUnknown || толькоТекст(x.pid);
}

function внестиАдресата(id){
  const x = S.queue.find(m => m.id === id); if (!x) return;
  const p = POP.поId[x.pid];
  /* toUnknown — фамилия, которую отправитель написал на конверте,
     а в картотеке её нет. Тогда вносить некого: письмо отклоняется. */
  const адресат = x.toUnknown || (x.dir === 'Входящее' ? x.to : x.from);
  const числится = !x.toUnknown && !!p;

  modal(`
    <div class="mh"><div><h3>Адресат письма</h3>
      <div class="top-sub">${esc(x.id)} · ${esc(x.from)} → ${esc(x.to)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note ${числится ? '' : 'warn'}" style="margin-top:0">
        ${числится
          ? `<b>Такой человек в картотеке учреждения числится,</b> но его личность
             не подтверждена оперативным сотрудником. Письмо вы можете обработать как обычно:
             текстовая переписка доступна и без подтверждения.`
          : `<b>Такой человек в картотеке учреждения не числится.</b>
             Письмо следует отклонить с отметкой «адресат не числится» и вернуть отправителю.`}
      </div>

      <div class="kv">
        <div class="k">Указан получателем</div><div>${esc(адресат)}</div>
        <div class="k">В картотеке</div>
        <div>${числится ? `<span class="chip g">числится</span> ${esc(p.name)}, ${esc(местоЧеловека(p))}`
          : '<span class="chip r">не числится</span>'}</div>
        <div class="k">Личность подтверждена</div>
        <div>${p && p.confirmed ? '<span class="chip g">да</span>' : '<span class="chip o">нет</span>'}</div>
      </div>

      ${числится ? `<div class="note">Если вы вносите его в систему, сведения уйдут оперативному
        сотруднику на подтверждение личности. Это не срочно: до подтверждения человеку
        доступна только текстовая переписка.</div>` : ''}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Закрыть</button>
      ${числится
        ? `<button class="btn primary" onclick="передатьНаПодтверждение('${x.id}')">Внести и передать оперу</button>`
        : `<button class="btn danger" onclick="отклонитьПоАдресату('${x.id}')">Отклонить: адресат не числится</button>`}
    </div>`);
}

function передатьНаПодтверждение(id){
  const x = S.queue.find(m => m.id === id); if (!x) return;
  const p = POP.поId[x.pid];
  if (!p) return;
  if (!ЗАЯВЛЕНИЯ.some(z => z.pid === p.id && (z.status === 'новое' || z.status === 'на подтверждении'))) {
    ЗАЯВЛЕНИЯ.unshift({
      id: 'З-' + (4400 + Math.floor(Math.random() * 99)),
      pid: p.id, person: p.name, dob: p.dob, unit: p.unit, article: p.article,
      source: 'цензор', want: 'подтверждение личности',
      contact: x.from, phone: '', at: '28.09.2026', daysAgo: 0,
      status: 'на подтверждении', by: null, letter: x.id, scan: false,
    });
  }
  closeModal(); render();
  toast('Передано оперативному сотруднику на подтверждение. Письмо обрабатывайте как обычно.');
}

function отклонитьПоАдресату(id){
  const x = S.queue.find(m => m.id === id); if (!x) return;
  x.status = 'denied';
  S.log.unshift({
    id: x.id, from: x.from, to: x.to, decision: 'deny',
    basis: 'адресат не числится в картотеке учреждения; отправление возвращается отправителю',
    by: профиль().name + ', цензор', at: nowStamp(), group: 1, act: String(++ACT_NO),
  });
  closeModal(); render();
  toast('Отклонено: адресат не числится. Отправление возвращается отправителю.');
}

/* ================== ДОКУМЕНТООБОРОТ НАЧАЛЬНИКА ==================

   Четыре вещи в одном месте: документы на подпись, поручения,
   обращения и исполняющий обязанности. Смысл каждой описан
   в data/head.js — здесь только экраны.

   Общее правило отработки: достаточно отметки «выполнено».
   Ни вложений, ни отчётов, ни подтверждений. Как только отметку
   становится ставить долго, её перестают ставить вовремя,
   и журнал расходится с тем, что происходит на самом деле.
*/

/* Двузначное число: 5 → «05». В прототипе своего такого помощника нет. */
const дв = n => String(n).padStart(2, '0');

const СЕГОДНЯ_ПРОТ = new Date(2026, 8, 28);

const ДОКУМЕНТЫ = (ROL.documents || []).map(д => ({ ...д }));
const ОБРАЩЕНИЯ = (ROL.appeals2 || []).map(о => ({ ...о }));
const ПОРУЧЕНИЯ = (ROL.orders || []).map(п => ({ ...п }));
const ПРОИЗВОДНЫЕ = [];

let НОМЕР_ПОРУЧЕНИЯ = ПОРУЧЕНИЯ.reduce(
  (м, п) => Math.max(м, Number(String(п.id).replace(/\D/g, '')) || 0), 420);

/* ---------- документы на подпись ---------- */

function ждутПодписи(){ return ДОКУМЕНТЫ.filter(д => д.status === 'waiting'); }
function подписанныеДок(){ return ДОКУМЕНТЫ.filter(д => д.status === 'signed'); }
function документовЖдёт(){ return ждутПодписи().length; }

function видыДокументовВСписке(){
  return [...new Set(ДОКУМЕНТЫ.map(д => д.kind))];
}

/* Бланк документа. Реквизиты — по ГОСТ Р 7.0.97-2016: наименование
   организации, вид документа, дата и номер, место составления,
   заголовок к тексту, текст, подпись. */
function бланкВходящего(д){
  const ф = У();
  const строка = (к, з) => `<div class="бл-к">${esc(к)}</div><div class="бл-з">${esc(з)}</div>`;
  return `
  <div class="бланк последний">
    <div class="бл-верх">
      <div class="бл-орг">
        ФЕДЕРАЛЬНАЯ СЛУЖБА ИСПОЛНЕНИЯ НАКАЗАНИЙ<br>
        ${esc(ф.parent || '')}<br>
        ${esc(ф.full || '')}<br>
        (${esc(ф.short || '')})
      </div>
    </div>

    <div class="бл-вид">${esc(д.kind.toUpperCase())}</div>

    <div class="бл-рек">
      <span>${esc(д.at)}</span>
      <span>№ ${esc(д.id)}</span>
    </div>
    <div class="бл-место">${esc(ф.city || '')}</div>

    <div class="бл-загол">${esc(д.gist)}</div>

    <div class="бл-свед">
      ${строка('Основание', д.norm)}
      ${строка('Подготовил', д.by)}
      ${строка('Поступил', д.at)}
      ${строка('Срок рассмотрения', д.dueDays + ' ' + plural(д.dueDays, 'день', 'дня', 'дней'))}
      ${д.person ? строка(Т('человек').charAt(0).toUpperCase() + Т('человек').slice(1), д.person) : ''}
      ${д.person ? строка(S.facility === 'сизо' ? 'Камера' : 'Отряд', д.unit) : ''}
    </div>

    <p class="бл-абз">${esc(д.gist)}</p>

    <div class="бл-подписи">
      <div class="бл-подпись">
        <span class="бл-кто">Начальник ${esc(ф.short || '')}</span>
        <span class="бл-линия"></span>
        <span class="бл-имя">${esc(инициалы(ПОДПИСАНТ.name))}</span>
      </div>
      <div class="бл-дата">«____» ____________ 2026 г.</div>
    </div>
  </div>`;
}

function открытьДокумент(id){
  const д = ДОКУМЕНТЫ.find(x => x.id === id); if (!д) return;
  modal(`
    <div class="mh"><div><h3>${esc(д.kind)}</h3>
      <div class="top-sub">${esc(д.id)} · ${esc(д.at)} · от ${esc(д.from)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      ${д.overdue ? `<div class="note warn" style="margin-top:0"><b>Срок вышел.</b>
        Документ лежит ${д.daysWaiting} ${plural(д.daysWaiting, 'день', 'дня', 'дней')},
        а рассмотреть его следовало за ${д.dueDays}.</div>` : ''}

      <div class="kv">
        <div class="k">Существо</div><div>${esc(д.gist)}</div>
        <div class="k">Основание</div><div>${esc(д.norm)}</div>
        <div class="k">Подготовил</div><div>${esc(д.by)}</div>
        ${д.person ? `<div class="k">${S.facility === 'сизо' ? 'Подозреваемый' : 'Осуждённый'}</div>
          <div>${esc(д.person)}, ${esc(д.unit)}</div>` : ''}
        <div class="k">Срок</div>
        <div>${д.dueDays} ${plural(д.dueDays, 'день', 'дня', 'дней')} ·
          лежит ${д.daysWaiting}</div>
      </div>

      ${д.derives ? `<div class="note"><b>После подписания система сформирует:</b>
        ${esc(д.derives)}. Отдельно составлять его не нужно — он собирается
        из этого же документа и попадёт в «Подписанные» вместе с ним.</div>` : ''}

      ${бланкВходящего(д)}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Закрыть</button>
      <button class="btn" onclick="doPrint()">${ICON.printer} Печать</button>
      <button class="btn" onclick="перепоручитьИз('${д.id}', '${esc(д.kind)}')">Перепоручить</button>
      ${д.status === 'waiting'
        ? `<button class="btn primary" onclick="подписатьДокумент('${д.id}')">Подписать</button>`
        : '<span class="chip g">подписан</span>'}
    </div>`);
}

/* Подписание порождает производный документ, если он у вида предусмотрен. */
function подписатьДокумент(id, тихо){
  const д = ДОКУМЕНТЫ.find(x => x.id === id); if (!д || д.status !== 'waiting') return;
  д.status = 'signed';
  д.signedAt = '28.09.2026';
  if (д.derives) {
    ПРОИЗВОДНЫЕ.push({
      id: 'П-' + (7100 + ПРОИЗВОДНЫЕ.length),
      kind: д.derives, basis: д.id, at: '28.09.2026', person: д.person, unit: д.unit,
    });
    д.derived = true;
  }
  if (!тихо) {
    closeModal();
    toast(д.derives ? `Подписано. Сформирован документ: ${д.derives}.` : 'Подписано.');
    render();
  }
}

function печатьОдного(id){
  const д = ДОКУМЕНТЫ.find(x => x.id === id); if (!д) return;
  печатьДокумента(бланкВходящего(д));
}

function печатьПроизводного(id){
  const п = ПРОИЗВОДНЫЕ.find(x => x.id === id); if (!п) return;
  const ф = У();
  печатьДокумента(`
    <div class="бланк последний">
      <div class="бл-верх"><div class="бл-орг">
        ФЕДЕРАЛЬНАЯ СЛУЖБА ИСПОЛНЕНИЯ НАКАЗАНИЙ<br>
        ${esc(ф.parent || '')}<br>${esc(ф.full || '')}<br>(${esc(ф.short || '')})
      </div></div>

/* ---------- один экран на всю подпись ----------

   Акты о недопуске приходят от цензора со своей формой по ГОСТ и своим
   реестром — они остаются отдельным списком. Всё остальное, что идёт
   по внутреннему документообороту, лежит рядом. Групповое действие
   одно и то же: подписать всё либо распечатать и подписать всё.
*/

function актыЖдут(){ return АКТЫ.filter(a => a.status === 'waiting'); }

function наПодписьВсего(){ return актыЖдут().length + ждутПодписи().length; }

function бланкиВсего(){
  const акты = актыЖдут();
  const доки = ждутПодписи();
  return акты.map((a, i) => бланкАкта(актИзОчереди(a), false)).join('')
       + доки.map(д => бланкВходящего(д)).join('');
}

function печатьВсегоНаПодпись(){
  if (!наПодписьВсего()) { toast('Печатать нечего'); return; }
  печатьДокумента(бланкиВсего());
}

/* Подписать всё: и акты, и прочие документы. Сначала показываем, что именно
   уходит под подпись — подпись удостоверяет основание по каждому документу. */
function подписатьВсёНаПодпись(печатать){
  const акты = актыЖдут();
  const доки = ждутПодписи();
  if (!акты.length && !доки.length) { toast('Неподписанных документов нет'); return; }
  const производных = доки.filter(д => д.derives).length;
  modal(`
    <div class="mh"><div><h3>${печатать ? 'Распечатать и подписать' : 'Подписать'}
      ${наПодписьВсего()} ${plural(наПодписьВсего(), 'документ', 'документа', 'документов')}</h3>
      <div class="top-sub">Подписант: ${esc(ПОДПИСАНТ.name)}, ${esc(ПОДПИСАНТ.post)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note warn" style="margin-top:0"><b>Подпись удостоверяет основание
        по каждому документу.</b> Если хотя бы один вызывает сомнение — подписывайте поштучно.</div>

      ${акты.length ? `<div class="бл-подзаг">Акты о недопуске · ${акты.length}</div>
        <ul class="plain warn-list">
          ${акты.map(a => `<li><b>${esc(a.id)}</b> · ${esc(a.person)} — ${esc(a.ground)}</li>`).join('')}
        </ul>` : ''}

      ${доки.length ? `<div class="бл-подзаг">Прочие документы · ${доки.length}</div>
        <ul class="plain warn-list">
          ${доки.map(д => `<li><b>${esc(д.id)}</b> · ${esc(д.kind)}${
            д.person ? ' — ' + esc(д.person) : ''}</li>`).join('')}
        </ul>` : ''}

      ${производных ? `<div class="note">После подписания система сформирует
        ${производных} ${plural(производных, 'производный документ', 'производных документа', 'производных документов')}:
        ${доки.filter(д => д.derives).map(д => esc(д.derives)).join('; ')}.</div>` : ''}
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="подтвердитьПодписьВсего(${печатать ? 'true' : 'false'})">
        ${печатать ? 'Распечатать и подписать' : 'Подписать всё'}</button>
    </div>`);
}

function подтвердитьПодписьВсего(печатать){
  const html = печатать ? бланкиВсего() : '';
  const акты = актыЖдут();
  const доки = ждутПодписи();
  акты.forEach(a => { a.status = 'signed'; });
  доки.forEach(д => подписатьДокумент(д.id, true));
  const производных = ПРОИЗВОДНЫЕ.length;
  closeModal();
  if (печатать) {
    печатьДокумента(html);
  } else {
    toast(`Подписано: ${акты.length + доки.length}` +
      (производных ? `. Сформировано производных: ${производных}.` : '.'));
  }
  render();
}

  return ч.join(' и ');
}

/* Выбор типового поручения сразу подставляет обычного исполнителя:
   начальнику остаётся только переназначить, если случай не обычный. */
function порТема(кнопка, текст){
  [...кнопка.parentNode.children].forEach(б => б.classList.remove('on'));
  кнопка.classList.add('on');
  S.порТекст = текст;
  const поле = document.getElementById('порТекст');
  if (поле) поле.value = текст;
  const кто = (ROL.orderWho || {})[текст];
  if (кто) {
    S.порКому = кто;
    const ряд = кнопка.parentNode.parentNode.querySelectorAll('.seg')[1]
      || document.querySelectorAll('.modal .seg')[1];
    if (ряд) [...ряд.children].forEach(б =>
      б.classList.toggle('on', б.textContent.trim() === кто));
  }
}

function порКому(кнопка, кому){
  [...кнопка.parentNode.children].forEach(б => б.classList.remove('on'));
  кнопка.classList.add('on');
  S.порКому = кому;
}

function сохранитьПоручение(){
  const текст = (document.getElementById('порТекст') || {}).value || S.порТекст;
  if (!String(текст).trim()) { toast('Не указано, что поручается'); return; }
  const сырая = (document.getElementById('порСрок') || {}).value || '';
  const ч = сырая.split('-');
  ПОРУЧЕНИЯ.unshift({
    id: 'ПОР-' + (++НОМЕР_ПОРУЧЕНИЯ),
    title: String(текст).trim(),
    basis: S.порОснование || null,
    to: S.порКому,
    due: ч.length === 3 ? `${ч[2]}.${ч[1]}.${ч[0]}` : '30.09.2026',
    overdue: false,
    status: 'открыто',
    by: 'Начальник учреждения',
    at: '28.09.2026',
    свежее: true,
  });
  S.порОснование = null; S.порТекст = '';
  closeModal();
  toast('Поручение поставлено');
  S.вкладкаПоручений = 'issued';
  go('orders');
}

/* ---------- исполняющий обязанности ----------

   Назначается на конкретные даты. Пока даты идут, у сотрудника открыт весь
   функционал начальника. Когда прошли — закрывается сам, без отдельного
   действия и без напоминания: именно здесь чаще всего забывают снять доступ.
*/

function иоЗапись(){ return S.ио || null; }

function датаИз(iso){
  const ч = String(iso || '').split('-');
  return ч.length === 3 ? new Date(Number(ч[0]), Number(ч[1]) - 1, Number(ч[2])) : null;
}

function иоАктивен(){
  const з = иоЗапись(); if (!з) return false;
  const с = датаИз(з.с), по = датаИз(з.по);
  if (!с || !по) return false;
  return СЕГОДНЯ_ПРОТ >= с && СЕГОДНЯ_ПРОТ <= по;
}

function иоИстёк(){
  const з = иоЗапись(); if (!з) return false;
  const по = датаИз(з.по);
  return !!по && СЕГОДНЯ_ПРОТ > по;
}

function читаемо(iso){
  const д = датаИз(iso);
  return д ? дв(д.getDate()) + '.' + дв(д.getMonth() + 1) + '.' + д.getFullYear() : '—';
}

function блокИО(){
  if (S.role !== 'head') return '';
  const з = иоЗапись();
  if (!з) return '';
  if (иоАктивен()) {
    return `<div class="note warn"><b>Исполняющий обязанности: ${esc(з.кто)}.</b>
      С ${читаемо(з.с)} по ${читаемо(з.по)}. На эти даты у него открыт весь ваш функционал:
      подпись документов, поручения и обращения. По истечении срока доступ закроется сам.
      <button class="btn sm" style="margin-left:10px" onclick="снятьИО()">Снять досрочно</button></div>`;
  }
  if (иоИстёк()) {
    return `<div class="note"><b>Срок исполняющего обязанности истёк ${читаемо(з.по)}.</b>
      Доступ ${esc(з.кто)} закрыт автоматически.
      <button class="btn sm" style="margin-left:10px" onclick="открытьИО()">Назначить снова</button></div>`;
  }
  return `<div class="note"><b>Исполняющий обязанности назначен: ${esc(з.кто)}.</b>
    Доступ откроется ${читаемо(з.с)} и закроется ${читаемо(з.по)}.
    <button class="btn sm" style="margin-left:10px" onclick="снятьИО()">Отменить</button></div>`;
}
