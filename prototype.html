/* ================== ДОСЬЕ КАК НАКОПИТЕЛЬ ==================

   Досье ведётся годами и должно отвечать на вопрос «что известно про этого
   человека» целиком, без похода по отделам. Поэтому оно разложено по
   разделам, а не вытянуто в одну простыню: главное, нарушения, связи,
   переписка, записи.

   Печать — отдельным действием и сразу вся: разово собрать на человека
   всё, включая нарушения, а не печатать по кусочку.
*/

/* Компактная выгрузка разворачивается один раз при загрузке. */
const НАРУШЕНИЯ = (ROL.violations || []).map(
  ([id, pid, at, суть, тяжесть, кем, мера, норма, срок, постановление, погашено]) =>
  ({ id, pid, at, суть, тяжесть, кем, мера, норма, срок, постановление, погашено: !!погашено }));

const ПООЩРЕНИЯ = (ROL.rewards || []).map(
  ([id, pid, at, мера, норма, основание, постановление]) =>
  ({ id, pid, at, мера, норма, основание, постановление }));

const ЗАПИСИ_ДОСЬЕ = (ROL.dossierNotes || []).map(
  ([id, pid, at, text, by]) => ({ id, pid, at, text, by }));

/* Индексы: иначе на 2400 человек каждый показ досье перебирает тысячи записей. */
const ПО_ЧЕЛОВЕКУ = (список) => {
  const карта = {};
  список.forEach(з => { (карта[з.pid] = карта[з.pid] || []).push(з); });
  return карта;
};
const НАРУШЕНИЯ_ПО = ПО_ЧЕЛОВЕКУ(НАРУШЕНИЯ);
const ПООЩРЕНИЯ_ПО = ПО_ЧЕЛОВЕКУ(ПООЩРЕНИЯ);
const ЗАПИСИ_ПО = ПО_ЧЕЛОВЕКУ(ЗАПИСИ_ДОСЬЕ);

function нарушенияЧеловека(pid){ return НАРУШЕНИЯ_ПО[pid] || []; }
function поощренияЧеловека(pid){ return ПООЩРЕНИЯ_ПО[pid] || []; }
function записиЧеловека(pid){ return ЗАПИСИ_ПО[pid] || []; }

function действующиеВзыскания(pid){
  return нарушенияЧеловека(pid).filter(н => !н.погашено);
}

/* Меры взыскания в колонии и в следственном изоляторе разные: перевода
   в ПКТ и ЕПКТ в изоляторе не бывает. Поэтому мера подбирается под режим
   учреждения по тяжести нарушения, а не берётся как есть.
     колония — ст. 115 УИК РФ;
     изолятор — ст. 39 и 40 ФЗ-103. */
function мераПоРежиму(н){
  if (S.facility !== 'сизо') return { мера: н.мера, норма: н.норма, срок: н.срок };
  return н.тяжесть === 1
    ? { мера: 'выговор', норма: 'ст. 39 ФЗ-103', срок: null }
    : { мера: 'водворение в карцер', норма: 'ст. 40 ФЗ-103', срок: 'до 15 суток' };
}

const ТЯЖЕСТЬ_СЛОВО = { 1: 'мелкое', 2: 'существенное', 3: 'злостное' };
const ТЯЖЕСТЬ_ЦВЕТ = { 1: '', 2: 'o', 3: 'r' };

/* ---------- рабочие записи ---------- */

let НОМЕР_ЗАПИСИ = 9000;

function добавитьЗапись(pid){
  const p = POP.поId[pid]; if (!p) return;
  const шаблоны = ROL.noteTemplates || [];
  S.записьТекст = '';
  modal(`
    <div class="mh"><div><h3>Запись в досье</h3>
      <div class="top-sub">${esc(p.name)} · ${esc(местоЧеловека(p))}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="note" style="margin-top:0">Запись остаётся в досье навсегда с датой и вашей
        фамилией. Она не заменяет рапорт и не влечёт последствий сама по себе — это то,
        что сегодня живёт в тетрадке и пропадает вместе с ней.</div>

      <label class="fld">Что записать</label>
      <div class="seg сборный" style="margin-bottom:10px">
        ${шаблоны.map(т => `<button onclick="записьШаблон(this, '${esc(т)}')">${esc(т)}</button>`).join('')}
      </div>
      <label class="fld">Или своими словами<input id="записьТекст" placeholder="Текст записи"></label>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="сохранитьЗапись('${pid}')">Записать</button>
    </div>`);
}

function записьШаблон(кнопка, текст){
  [...кнопка.parentNode.children].forEach(б => б.classList.remove('on'));
  кнопка.classList.add('on');
  S.записьТекст = текст;
  const поле = document.getElementById('записьТекст');
  if (поле) поле.value = текст;
}

function сохранитьЗапись(pid){
  const текст = ((document.getElementById('записьТекст') || {}).value || S.записьТекст || '').trim();
  if (!текст) { toast('Запись пустая'); return; }
  const з = { id: 'З-' + (++НОМЕР_ЗАПИСИ), pid, at: сегодняДок(),
              text: текст, by: профиль().name + ', ' + профиль().post, свежая: true };
  ЗАПИСИ_ДОСЬЕ.unshift(з);
  (ЗАПИСИ_ПО[pid] = ЗАПИСИ_ПО[pid] || []).unshift(з);
  closeModal();
  toast('Записано в досье');
  открытьДосье(pid, 'notes');
}

    return `
      <table class="бл-таб">
        <colgroup><col style="width:4%"><col style="width:9%"><col style="width:30%">

        <tr><th>№</th><th>Дата</th><th>Существо нарушения</th><th>Кем выявлено</th>
          <th>Мера взыскания</th><th>Основание</th><th>Состояние</th></tr>
        ${нар.map((н, i) => `<tr>
          <td>${i + 1}</td><td>${esc(н.at)}</td><td>${esc(н.суть)}</td>
          <td>${esc(н.кем)}</td>
          ${(() => { const м = мераПоРежиму(н); return `
            <td>${esc(м.мера)}${м.срок ? ', ' + esc(м.срок) : ''}</td>
            <td>${esc(м.норма)}<br>пост. № ${esc(н.постановление)}</td>`; })()}
          <td>${н.погашено ? 'погашено' : 'действует'}</td>
        </tr>`).join('')}
      </table>
      <p class="бл-абз">Всего нарушений: ${нар.length}, из них взысканий действующих: ${действ.length}.</p>`;

    ${действ.length ? `<div class="note warn" style="margin-top:0">
      <b>Действующих взысканий: ${действ.length}</b> из ${нар.length}

      : `<div class="note" style="margin-top:0">Все взыскания погашены. Всего нарушений за год: ${нар.length}.</div>`}
    <div class="clist" style="margin-top:12px">
      ${нар.map(н => `
        <div class="citem"><div>
          <div class="w">${esc(н.суть)}

            ${н.погашено ? '<span class="chip">погашено</span>' : '<span class="chip r">действует</span>'}</div>
          <div class="s">${esc(н.at)} · выявил ${esc(н.кем)}</div>
          ${(() => { const м = мераПоРежиму(н); return `
            <div class="s" style="margin-top:4px">Взыскание: ${esc(м.мера)}${м.срок ? ', ' + esc(м.срок) : ''}
              · ${esc(м.норма)} · постановление № ${esc(н.постановление)}</div>`; })()}
        </div></div>`).join('')}

}

/* ---------- само досье ---------- */

const ВКЛАДКИ_ДОСЬЕ = [
  ['main', 'Главное'],
  ['violations', 'Нарушения'],
  ['links', 'Связи'],
  ['comms', 'Переписка'],
  ['notes', 'Записи'],
];

function открытьДосье(id, вкладка){
  const p = ROL.persons.find(x => x.id === id); if (!p) return;
  S.вкладкаДосье = вкладка || S.вкладкаДосье || 'main';
  const в = S.вкладкаДосье;
  const нар = нарушенияЧеловека(p.id);
  const действ = действующиеВзыскания(p.id);

  const счёт = { main: '', violations: нар.length ? ' · ' + нар.length : '',
    links: ' · ' + p.contacts.length, comms: '', notes: ' · ' + записиЧеловека(p.id).length };

  modal(`
    <div class="mh"><div><h3>${esc(p.name)}</h3>
      <div class="top-sub">${esc(p.dob)} · ${esc(p.citizenship)} · ${esc(местоЧеловека(p))} · ${esc(У().name)}</div></div>
      <button class="x" onclick="closeModal()" aria-label="Закрыть">×</button></div>
    <div class="mb">
      <div class="bar" style="margin-top:0">
        <div class="seg">
          ${ВКЛАДКИ_ДОСЬЕ.map(([к, имя]) =>
            `<button class="${в === к ? 'on' : ''}" onclick="открытьДосье('${p.id}','${к}')">${имя}${счёт[к]}</button>`).join('')}
        </div>
      </div>

      ${действ.length ? `<div class="note warn"><b>Действующих взысканий: ${действ.length}.</b>
        Последнее — ${esc(мераПоРежиму(действ[0]).мера)} от ${esc(действ[0].at)} за ${esc(действ[0].суть)}.</div>` : ''}

      ${в === 'main' ? `
        <div class="kv">
          <div class="k">${S.facility === 'сизо' ? 'Камера' : 'Отряд'}</div><div>${esc(местоЧеловека(p))}</div>
          <div class="k">Статья</div><div>${esc(p.article)}</div>
          <div class="k">В учреждении с</div><div>${esc(p.since)}</div>
          <div class="k">Личность</div>
          <div>${p.confirmed
            ? '<span class="chip g">подтверждена</span> доступны звонки и сообщения'

          <div class="k">Нарушений за год</div>
          <div>${нар.length}${действ.length ? ` · <span class="chip r">действующих взысканий: ${действ.length}</span>` : ' · взысканий не действует'}</div>
          <div class="k">Поощрений</div><div>${поощренияЧеловека(p.id).length}</div>
        </div>

        ${блокОпасныхСвязей(p)}
        ${блокСигналов(p.id)}
        ${блокУчётаВДосье(p.id)}
        ${блокСоучастников(p.id)}

        ${(() => { const мат = вДосье(p.id); return мат.length ? `
          <h3 style="margin:22px 0 10px; font-size:16px">Приобщено к досье · ${мат.length}</h3>
          <div class="clist">${мат.map(м => `
            <div class="citem"><div>
              <div class="w">${esc(м.id)} · ${esc(м.решение)}</div>
              <div class="s">${esc(м.резюме)}</div>
              ${м.записка ? `<div class="s" style="margin-top:4px">Цензор: «${esc(м.записка)}»</div>` : ''}
              <div class="s" style="margin-top:4px">${esc(м.by)}, ${esc(м.at)}${м.дело ? ' · дело ' + esc(м.дело) : ''}</div>
            </div><button class="btn sm" onclick="closeModal(); открытьМатериал('${м.id}')">Открыть</button></div>`).join('')}</div>` : ''; })()}
      ` : ''}

      ${в === 'violations' ? `
        <h3 style="margin:18px 0 10px; font-size:16px">Нарушения установленного порядка · ${нар.length}</h3>
        ${блокНарушений(p, false)}
        ${блокПоощрений(p, false)}
      ` : ''}

      ${в === 'links' ? `
        <h3 style="margin:18px 0 10px; font-size:16px">Контакты · ${p.contacts.length}</h3>
        ${p.contacts.length ? '' : `<div class="note warn" style="margin-top:0">Перечень контактов не заведён.
          Связь возможна только бумажной перепиской — звонков и сообщений у этого человека нет.</div>`}
        <div class="clist">${p.contacts.map((c, i) => контактHTML(p.id, i, c)).join('')}</div>
        <div class="note" style="margin-top:14px">Отключение канала — это ограничение доступности контакта
          в ОСНОВЕ, а не правка заявления заключённого. Основание и срок сохраняются в журнале.</div>

        ${(() => { const связи = связиЧеловека(p); return связи.length ? `
          <h3 style="margin:22px 0 10px; font-size:16px">Связи с другими людьми · ${связи.length}</h3>

              <div class="marks" style="margin-top:8px">${x.люди.map(o =>
                `<button class="chip ${RISK_LETTER[o.risk]}" onclick="открытьДосье('${o.id}')">${esc(o.name)}</button>`).join('')}</div>
            </div></div>`).join('')}</div>` : ''; })()}
      ` : ''}

      ${в === 'comms' ? `
        ${блокСигналов(p.id)}
        ${(() => { const ист = историяЧеловека(p); return `
          <h3 style="margin:22px 0 10px; font-size:16px">Коммуникации за смену · ${ист.length}</h3>

              <div class="w"><span class="chip ${RISK_LETTER[m.risk]}">${RISK_ONE[m.risk]}</span> ${esc(m.from)} → ${esc(m.to)}</div>

      ` : ''}

      ${в === 'notes' ? блокЗаписей(p, false) : ''}
    </div>
    <div class="mf">
      <button class="btn" onclick="печатьДосье('${p.id}')">${ICON.printer} Печать досье</button>
      <button class="btn" onclick="добавитьЗапись('${p.id}')">Запись</button>
      <button class="btn" onclick="открытьШкалу('${p.id}')">Шкала</button>
      <button class="btn" onclick="открытьГраф('${p.id}')">Связи</button>
      <button class="btn" onclick="closeModal(); открытьРапорт('${p.id}')">Рапорт на учёт</button>
      <button class="btn primary" onclick="вСвоюГруппу('${p.id}')">В свою группу</button>
    </div>`);
}
